<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon espace — Volakits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   VOLAKITS — Design System
   ──────────────────────────────────────────────────────────────────────────
   LA RÈGLE : un seul aplat fort par écran.
   Le bleu de marque ne porte qu'UNE grande surface à la fois — le pavé de
   gains sur l'accueil, le palier courant sur les paliers, le bouton
   d'action sur le profil. Partout ailleurs il se limite aux petits signaux.
   Certains écrans n'ont aucun aplat : c'est volontaire, ça donne du repos.
   Multiplier les surfaces fortes ne renforce pas la couleur, ça la dilue —
   c'est ce qui rendait les versions précédentes agressives.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
    /* Surfaces — crème neutre, jamais bleuté : un fond légèrement bleu fait
       basculer l'ensemble du côté « tableau de bord ». */
    --bg:#F4F4F1;
    --surface:#FFFFFF;
    --surface-2:#FAFAF8;
    /* Navigation : bleu très sombre, de la famille de la marque. Plus jamais
       de noir — un noir neutre concurrence l'aplat bleu au lieu de le porter. */
    --sidebar:#141D52;
    --sidebar-2:#1B2664;

    /* Texte */
    --ink:#101322;
    --ink-2:#3B3E4C;
    --muted:#8A8C84;
    --faint:#A0A198;
    --on-dark:#E8ECFA;
    --on-dark-dim:#7182BC;

    /* Accent */
    /* #2F50F1 : couleur signature Volakits, en aplat PLEIN (aucun dégradé —
       un dégradé date, et il brouille la frontière de la surface). */
    --accent:#2F50F1;
    --accent-2:#2846DC;
    --accent-soft:#E7EBFE;
    --accent-ring:rgba(47,80,241,.16);
    --accent-grad:#2F50F1;
    /* Texte posé SUR l'aplat bleu */
    --on-accent:#C7D3FF;
    --on-accent-dim:#A8B8FF;
    --on-accent-lab:#B9C6FF;

    /* Statuts — désaturés pour ne pas rivaliser avec le bleu de marque */
    --ok:#1F8A5B;      --ok-soft:#E4F3EC;
    --warn:#B87A18;    --warn-soft:#FBF1DF;
    --info:#2F50F1;    --info-soft:#E7EBFE;
    --danger:#C0392B;  --danger-soft:#FBEBE9;
    --gold:#B08A1E;    --gold-soft:#F8F1DF;

    /* Traits */
    --line:#E2E1DA;
    --line-2:#DEDDD5;

    /* Ombres */
    /* Plus aucune ombre : la hiérarchie vient de l'espace et de la
       typographie. Les variables restent pour ne rien casser ailleurs. */
    --sh-xs:none; --sh-sm:none; --sh-md:none; --sh-lg:none; --sh-accent:none;

    /* Rayons */
    --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:var(--accent);color:#fff}
html{-webkit-text-size-adjust:100%}
body{
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    letter-spacing:-.011em;line-height:1.5;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit}
/* ── Layout ─────────────────────────────────────────────────────────────── */
.shell{display:flex;min-height:100vh}
/* ── Sidebar (sombre) ───────────────────────────────────────────────────── */
.side{
    width:250px;flex-shrink:0;background:var(--sidebar);color:var(--on-dark);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    padding:22px 14px;
}
.side-brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;margin-bottom:6px}
.brand-mark{
    width:34px;height:34px;border-radius:9px;background:var(--accent-grad);
    display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;
    flex-shrink:0;
}
.brand-name{font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.brand-sub{font-size:10.5px;color:var(--on-dark-dim);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.side-user{background:none!important;padding-left:8px!important;padding-right:8px!important;
    display:flex;align-items:center;gap:11px;padding:11px;margin-bottom:18px;
    background:var(--sidebar-2);border-radius:var(--r);
}
.side-avatar{
    width:36px;height:36px;border-radius:10px;background:var(--accent-grad);
    display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0;
}
.side-user-info{min-width:0;flex:1}
.side-user-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user-tier{font-size:11px;color:var(--on-dark-dim);font-weight:600;display:flex;align-items:center;gap:4px}
.nav-group{margin-bottom:16px}
.nav-label{
    font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--on-dark-dim);padding:0 10px 7px;
}
.nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;
    font-size:13.5px;font-weight:600;color:var(--on-dark-dim);
    transition:background .16s,color .16s;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--on-dark)}
.nav-item.active{background:rgba(255,255,255,.09);color:#fff;box-shadow:none}
.nav-item.active .nav-ico{color:#7E97FF}
.nav-ico{width:17px;height:17px;flex-shrink:0;stroke-width:1.9}
.nav-badge{
    margin-left:auto;background:rgba(255,255,255,.14);font-size:10.5px;font-weight:800;
    padding:1px 7px;border-radius:20px;
}
.nav-item.active .nav-badge{background:rgba(255,255,255,.25)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.07)}
.side-help{font-size:11.5px;color:var(--on-dark-dim);line-height:1.6}
.side-help a{color:#7E97FF;font-weight:600}
/* ── Contenu ────────────────────────────────────────────────────────────── */
.main{flex:1;min-width:0;padding:44px 40px 90px}
.wrap{max-width:860px;margin:0 auto}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.hello h1{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.hello p{color:var(--muted);font-size:14px;font-weight:500;margin-top:5px}
.tier-pill .dot{width:8px;height:8px;border-radius:50%}
/* ── Cartes ─────────────────────────────────────────────────────────────── */
/* Une « carte » n'est plus qu'une section : l'espace la délimite, pas un cadre. */
.card{background:none;border:none;border-radius:0;box-shadow:none;padding:0}
.card + .card{margin-top:40px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.card-title{font-size:17px;font-weight:700;letter-spacing:-.025em;display:flex;align-items:center;gap:9px}
/* L'icône n'a plus de carré coloré derrière elle. */
.card-title .ico-box{width:auto;height:auto;background:none;color:var(--faint);display:none}
.card-sub{font-size:12.5px;color:var(--muted);font-weight:500}
/* ── Grilles ────────────────────────────────────────────────────────────── */
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:1fr 1fr}
/* ══ Accueil ═══════════════════════════════════════════════════════════════
   Une seule surface de marque porte les gains. Le reste est blanc, structuré
   par la typographie et l'espace. Rien n'est affiché sans donnée réelle.
   ═════════════════════════════════════════════════════════════════════════ */

/* — Carte des gains — */
/* ── L'APLAT FORT ─────────────────────────────────────────────────────────
   C'est la seule grande surface colorée de l'accueil. Aplat plein, sans
   dégradé ni halo : la frontière de la surface doit être franche, sinon la
   couleur paraît sale. Tout le reste de la page reste en retrait pour ne
   pas lui disputer la place. */
.gains{position:relative;overflow:hidden;color:#fff;border-radius:24px;
    padding:30px 28px 26px;background:var(--accent)}
.gains > *{position:relative;z-index:1}
.gains-k{font-size:10.5px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;
    color:var(--on-accent-lab)}
.gains-v{font-size:62px;font-weight:700;letter-spacing:-.052em;line-height:.94;margin-top:15px}
.gains-sub{font-size:13px;color:var(--on-accent);font-weight:500;margin-top:12px}
.gains-sep{height:1px;background:rgba(255,255,255,.2);margin:24px 0 0}
/* Les faits passent en petites capitales espacées : ils informent sans
   rivaliser avec le montant, qui reste seul à être lu de loin. */
.gains-facts{display:flex;align-items:center;margin-top:18px;font-size:9.5px;
    font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--on-accent-dim);flex-wrap:wrap;row-gap:8px}
.gains-facts > .num{padding-right:13px;margin-right:13px;
    border-right:1px solid rgba(255,255,255,.24)}
.gains-facts > .num:last-child{border-right:none;padding-right:0;margin-right:0}
.gains-facts .d{display:none}

/* — Objectif : la récompense d'abord, le décompte ensuite — */
.goal{background:var(--surface);border:none;border-radius:18px;padding:24px;margin-top:14px}
.goal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.goal-k{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.goal-left{font-size:26px;font-weight:700;letter-spacing:-.04em;margin-top:12px;line-height:1.1}
.goal-for{font-size:13.5px;color:var(--muted);font-weight:500;margin-top:5px}
.rewards{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.rw{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;
    background:var(--accent-soft);color:var(--accent);border-radius:100px;padding:8px 14px;
    opacity:0;transform:translateY(6px);animation:rise .45s ease forwards}
.rw svg{width:13px;height:13px;stroke-width:2.2;opacity:.75}
.goal-bar{height:6px;background:#EDECE5;border-radius:100px;overflow:hidden;margin-top:20px}
.goal-fill{height:100%;border-radius:100px;background:var(--accent);width:0;transition:width 1.2s ease}
.goal-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;
    margin-top:11px;flex-wrap:wrap}
.goal-cnt{font-size:12.5px;color:var(--faint);font-weight:600}
.goal-cta{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;
    color:var(--accent);transition:gap .18s ease;cursor:pointer}
.goal-cta:hover{gap:9px}
.goal-cta svg{width:14px;height:14px;stroke-width:2.2}
.goal-done{font-size:13.5px;font-weight:600;color:var(--ok);margin-top:14px}

/* Fin de mois : l'urgence passe par la couleur du trait et une ligne de
   date, pas par un bandeau ni un badge. Le bloc garde exactement sa forme. */
.goal.urgent{background:var(--warn-soft)}
.goal-dl{display:inline-flex;align-items:center;gap:7px;margin-top:12px;
    font-size:12.5px;font-weight:700;color:var(--warn);letter-spacing:-.01em}
.goal-dl::before{content:"";width:6px;height:6px;border-radius:100px;background:var(--warn)}
.goal.urgent .goal-fill{background:var(--warn)}

/* Classement : même graisse que les autres faits, jamais mis en avant —
   sauf sur le podium, réellement tenu, où l'accent de marque le signale. */
/* Sur l'aplat bleu, le podium se signale en blanc plein — l'accent de
   marque y serait invisible. */
.rank{color:inherit}
.rank-top{color:#fff}

/* — Code d'accès — */
.pin-back{position:fixed;inset:0;z-index:200;background:rgba(11,16,32,.42);
    display:grid;place-items:center;padding:20px;animation:pinIn .18s ease}
.pin-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
    padding:28px;width:100%;max-width:380px}
.pin-t{font-size:19px;font-weight:700;letter-spacing:-.03em}
.pin-d{font-size:13.5px;color:var(--muted);font-weight:500;margin-top:7px;line-height:1.55}
.pin-in{width:100%;margin-top:20px;padding:14px 16px;border:1px solid var(--line-2);
    border-radius:var(--r);font-size:26px;font-weight:700;text-align:center;
    letter-spacing:.42em;text-indent:.42em;background:var(--surface-2);color:var(--ink);
    outline:none;transition:border-color .16s ease}
.pin-in:focus{border-color:var(--accent);background:var(--surface)}
.pin-err{min-height:18px;margin-top:9px;font-size:12.5px;font-weight:600;color:var(--danger)}
.pin-acts{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:10px}
.pin-ghost{font-size:13.5px;font-weight:600;color:var(--muted);padding:10px 14px;border-radius:100px}
.pin-ghost:hover{color:var(--ink)}
@keyframes pinIn{from{opacity:0}to{opacity:1}}

/* Rail des paliers : la position rendue tangible, sans donnée nouvelle. */
.rail{display:flex;align-items:center;gap:5px;flex-shrink:0}
.rail-s{width:16px;height:4px;border-radius:100px;background:#E5E4DC}
.rail-s.done{background:var(--accent)}
.rail-s.now{background:var(--accent);width:24px;box-shadow:0 0 0 3px var(--accent-ring)}
.rail-l{font-size:11px;font-weight:700;color:var(--faint);margin-left:3px}

/* — Sections — */
.sec + .sec{margin-top:38px}
.sec-k{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);margin-bottom:4px}
.sec-t{font-size:18px;font-weight:700;letter-spacing:-.03em}

/* — Missions présentées comme des gains — */
.task{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;
    border:none;border-radius:14px;background:var(--surface);cursor:pointer;margin-bottom:7px;
    transition:opacity .16s ease,transform .16s ease}
.task:last-of-type{margin-bottom:0}
.task:hover{opacity:.62}
.task:active{transform:scale(.994)}
.task-e{width:36px;height:36px;border-radius:11px;background:var(--surface-2);
    display:grid;place-items:center;font-size:16px;flex-shrink:0}
.task-e.ok{background:var(--ok-soft)}
.task-b{flex:1;min-width:0}
.task-t{font-size:15px;font-weight:600;letter-spacing:-.02em}
.task-w{font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.task-go{color:var(--faint);flex-shrink:0;display:grid;place-items:center}
.task-go svg{width:15px;height:15px;stroke-width:2.2}
.task.is-done .task-t{color:var(--faint)}

/* — Code promo — */
.promo{display:flex;align-items:center;gap:14px;background:var(--surface);
    border-radius:18px;padding:22px 24px}
.promo-c{flex:1;min-width:0;font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:24px;font-weight:700;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis}
.copy-btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;
    border:none;border-radius:100px;padding:10px 18px;font-size:13.5px;font-weight:600;
    flex-shrink:0;cursor:pointer;transition:background .2s ease,transform .16s ease}
.copy-btn:hover{transform:translateY(-1px)}
.copy-btn:active{transform:scale(.97)}
.copy-btn.done{background:var(--ok)}
.copy-btn svg{width:14px;height:14px;stroke-width:2.4}
.promo-meta{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;
    color:var(--muted);font-weight:500;flex-wrap:wrap}
.promo-meta b{color:var(--ink);font-weight:700}
.promo-meta .d{width:3px;height:3px;border-radius:50%;background:var(--line-2)}

/* — Évolution : vide tant qu'il n'y a pas deux mois d'historique — */
.chart-empty{border:1px dashed var(--line-2);border-radius:18px;padding:34px 24px;text-align:center}
.chart-empty-t{font-size:14.5px;font-weight:600}
.chart-empty-d{font-size:13px;color:var(--muted);font-weight:500;margin-top:5px;
    max-width:280px;margin-left:auto;margin-right:auto;line-height:1.55}
.spark{display:block;width:100%;height:76px;margin-top:6px}
.spark-x{display:flex;justify-content:space-between;font-size:12px;
    color:var(--faint);font-weight:600;margin-top:4px}

/* — Ligne simple — */
.line{display:flex;align-items:center;gap:14px;padding:16px 0;width:100%;text-align:left;
    background:none;border:none;cursor:pointer}
.line-b{flex:1;min-width:0}
.line-t{font-size:15px;font-weight:600;letter-spacing:-.02em}
.line-d{font-size:13px;color:var(--muted);font-weight:500;margin-top:1px}
.line-v{font-size:13px;color:var(--faint);font-weight:600;flex-shrink:0}

/* — Classes partagées avec les autres vues — */
.num{font-variant-numeric:tabular-nums}
.line-status{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    font-size:13px;color:var(--muted);font-weight:500}
.line-status b{color:var(--ink);font-weight:700}
.sep{width:3px;height:3px;border-radius:50%;background:var(--line-2);flex-shrink:0}
.kpi-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* — Apparition — */
.rise{opacity:0;transform:translateY(10px);animation:rise .5s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}

@media(max-width:860px){
    .gains{padding:24px 22px 22px;border-radius:22px}
    .gains-v{font-size:46px}
    .goal-left{font-size:24px}
    /* Le décompte et le lien ne tiennent pas sur une ligne : on les empile. */
    .goal-foot{flex-direction:column;align-items:flex-start;gap:13px}
    .sec + .sec{margin-top:34px}
    .promo-c{font-size:21px}
}

/* ── Timeline paliers ───────────────────────────────────────────────────── */
.ladder{display:flex;flex-direction:column;gap:0}
.rung{display:flex;gap:14px;position:relative;padding-bottom:20px}
.rung:last-child{padding-bottom:0}
.rung::before{
    content:'';position:absolute;left:15px;top:34px;bottom:0;width:2px;background:var(--line-2);
}
.rung:last-child::before{display:none}
.rung.reached::before{background:var(--accent)}
.rung-badge{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    font-size:15px;background:var(--surface-2);border:2px solid var(--line-2);position:relative;z-index:1;
}
.rung.reached .rung-badge{background:var(--accent-soft);border-color:var(--accent)}
.rung.current .rung-badge{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.rung-body{padding-top:3px;min-width:0;flex:1}
.rung-name{font-size:13.5px;font-weight:800;letter-spacing:-.015em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rung-tag{
    font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;
    background:var(--accent);color:#fff;
}
.rung-perks{margin-top:7px;display:flex;flex-direction:column;gap:4px}
.rung-perk{font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;gap:7px;align-items:flex-start;line-height:1.45}
.rung-perk svg{flex-shrink:0;margin-top:2px}
.rung:not(.reached) .rung-perk{color:var(--faint)}
/* ── Missions ───────────────────────────────────────────────────────────── */
/* Une mission est une ligne, séparée par un filet — pas une carte. */
.mission{
    display:flex;align-items:center;gap:14px;padding:17px 18px;border-radius:14px;
    border:none;background:var(--surface);margin-bottom:7px;
    transition:opacity .15s;
}
.mission:last-child{margin-bottom:0}
.mission:hover{opacity:.65}
.mission.done{background:none}
.mission-check{
    width:18px;height:18px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    border:1.5px solid var(--line-2);background:var(--surface);
}
.mission.done .mission-check{background:var(--ok);border-color:var(--ok)}
.mission-body{flex:1;min-width:0}
.mission-label{font-size:14.5px;font-weight:600;letter-spacing:-.015em}
.mission.done .mission-label{color:var(--faint);text-decoration:line-through}
.mission-desc{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.mission-state{font-size:12px;font-weight:500;padding:0;border-radius:0;flex-shrink:0;background:none}
.st-done{background:none;color:var(--ok)}
.st-todo{background:none;color:var(--faint);border:none}
/* ── Colis / timeline ───────────────────────────────────────────────────── */
.ship{display:flex;flex-direction:column;gap:0;margin-top:2px}
.ship-step{display:flex;gap:12px;position:relative;padding-bottom:14px}
.ship-step:last-child{padding-bottom:0}
.ship-step::before{content:'';position:absolute;left:5px;top:16px;bottom:0;width:1px;background:var(--line)}
.ship-step:last-child::before{display:none}
.ship-step.done::before{background:var(--ok)}
/* Repère de 11px, pas une pastille : l'étape se lit dans le texte. */
.ship-dot{
    width:11px;height:11px;margin-top:5px;border-radius:50%;flex-shrink:0;
    border:1.5px solid var(--line-2);background:var(--surface);
    display:grid;place-items:center;position:relative;z-index:1;overflow:hidden;
}
.ship-dot svg{display:none}
.ship-step.done .ship-dot{background:var(--ok);border-color:var(--ok)}
.ship-step.current .ship-dot{border-color:var(--accent);background:var(--accent);box-shadow:none}
.ship-label{font-size:13.5px;font-weight:500;padding-top:0}
.ship-step:not(.done):not(.current) .ship-label{color:var(--faint)}
.ship-date{font-size:11.5px;color:var(--muted);font-weight:500}
.track-box{
    background:none;border:none;border-radius:0;
    padding:0;margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.track-num{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:.02em;flex:1;min-width:120px;word-break:break-all}
/* ── Boutons ────────────────────────────────────────────────────────────── */
.btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 19px;border-radius:11px;font-size:13.5px;font-weight:700;
    background:var(--accent-grad);color:#fff;box-shadow:var(--sh-accent);
    transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s;letter-spacing:-.01em;
}
.btn:hover{opacity:.9}
.btn:active{opacity:1}
/* Action secondaire : un lien, pas un bouton dessiné. */
.btn-ghost{
    background:none;color:var(--muted);border:none;box-shadow:none;padding:0;
    font-size:13px;border-radius:0;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:color .15s;
}
.btn-ghost:hover{color:var(--accent)}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:9px}
/* ── Empty state ────────────────────────────────────────────────────────── */
.empty{text-align:center;padding:30px 18px}
.empty-ico{
    width:auto;height:auto;background:none;color:var(--faint);
    display:grid;place-items:center;margin:0 auto 10px;
}
.empty-title{font-size:14px;font-weight:700;letter-spacing:-.015em}
.empty-text{font-size:12.5px;color:var(--muted);font-weight:500;margin:5px auto 15px;max-width:280px;line-height:1.55}
/* ── Divers ─────────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:0;border-radius:0;background:none!important}
.b-ok{color:var(--ok)}
.b-warn{color:var(--warn)}
.b-info{color:var(--accent)}
.b-muted{color:var(--faint)}
.skeleton{background:linear-gradient(90deg,#EAE9E2 25%,#F5F4F0 50%,#EAE9E2 75%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
    background:var(--sidebar);color:#fff;padding:12px 20px;border-radius:100px;
    font-size:13px;font-weight:700;box-shadow:var(--sh-lg);z-index:99;
    transition:transform .32s cubic-bezier(.2,.8,.2,1);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.mob-nav{display:none}
/* ── Formulaire profil ──────────────────────────────────────────────────── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.field input,.field select{
    background:var(--surface-2);border:1px solid var(--line-2);border-radius:11px;
    padding:11px 13px;font-size:13.5px;font-weight:500;color:var(--ink);width:100%;
    transition:border-color .15s,background .15s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);background:#fff;
    box-shadow:0 0 0 3px rgba(47,80,241,.08)}
.field input::placeholder{color:var(--faint)}
.field-hint{font-size:11px;color:var(--faint);font-weight:500}
/* Le groupe par réseau n'a pas besoin d'un cadre : un filet suffit.
   Les champs, eux, gardent leur bordure — elle est fonctionnelle. */
.plat-block{border:none;border-radius:0;padding:20px 0;background:none;margin-bottom:0;border-bottom:1px solid var(--line)}
.plat-block:last-of-type{border-bottom:none}
.plat-head{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.plat-ico{width:20px;height:20px;border-radius:0;background:none!important;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.plat-name{font-size:14px;font-weight:600}
.plat-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
@media(max-width:640px){.plat-fields{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
/* ── Sélecteur de maillots ──────────────────────────────────────────────── */
.pick-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pick-count{font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:100px;background:var(--accent-soft);color:var(--accent)}
.pick-count.full{background:var(--ok-soft);color:var(--ok)}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
.jcard{border:2px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);
       cursor:pointer;transition:all .16s;position:relative}
.jcard:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--sh-md)}
.jcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,80,241,.1),var(--sh-md)}
.jcard-img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;display:block}
.jcard-body{padding:10px 11px;border-top:1px solid var(--line)}
.jcard-name{font-size:12.5px;font-weight:800;letter-spacing:-.015em;line-height:1.3}
.jcard-sub{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}
.jcard-tick{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;
            background:var(--accent);display:none;place-items:center;box-shadow:var(--sh-md)}
.jcard.sel .jcard-tick{display:grid}
.jsizes{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.jsize{flex:1;min-width:30px;text-align:center;padding:5px 2px;border-radius:7px;border:1px solid var(--line-2);
       font-size:11.5px;font-weight:800;background:var(--surface-2);color:var(--ink-2);transition:all .13s}
.jsize:hover{border-color:var(--accent)}
.jsize.on{background:var(--accent);border-color:var(--accent);color:#fff}
.jsize.out{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.picked{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:14px}
.picked-item{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid var(--accent-soft);
             border-radius:var(--r);padding:8px 13px 8px 8px}
.picked-img{width:38px;height:38px;border-radius:8px;object-fit:contain;background:#fff;flex-shrink:0}
.picked-name{font-size:12.5px;font-weight:800;line-height:1.25}
.picked-size{font-size:11px;color:var(--accent);font-weight:700}
.picked-rm{color:var(--muted);font-size:15px;cursor:pointer;padding:0 3px}
.picked-rm:hover{color:var(--danger)}
.sticky-save{position:sticky;bottom:14px;margin-top:18px;display:flex;justify-content:center;z-index:20}
.sticky-save .btn{box-shadow:var(--sh-lg)}
@media(max-width:860px){.sticky-save{bottom:78px}}
/* ── Responsive (mobile-first pour l'espace influenceur) ────────────────── */
@media(max-width:1060px){
    .g-main{grid-template-columns:1fr}
}
@media(max-width:860px){
    .side{display:none}
    .main{padding:18px 16px 90px}
    .hello h1{font-size:22px}
    .g-2{grid-template-columns:1fr}
    /* Six onglets : la barre est plus dense, mais Contenus doit y figurer —
       c'est sur téléphone que les vidéos se déclarent. Le filet remplace
       l'ombre portée : il sépare aussi nettement, sans halo. */
    .mob-nav{
        display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--sidebar);
        padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:50;
        border-top:1px solid rgba(255,255,255,.07);
    }
    .mob-item{
        flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
        padding:6px 1px;color:var(--on-dark-dim);font-size:9.5px;font-weight:700;
        border-radius:9px;letter-spacing:-.01em;
    }
    .mob-item svg{width:18px;height:18px}
    .mob-item.active{color:#fff;background:rgba(255,255,255,.09)}
    .mob-head{
        display:flex;align-items:center;gap:11px;margin-bottom:18px;
        padding:13px 15px;background:var(--sidebar);border-radius:var(--r-lg);color:#fff;
    }
}
@media(min-width:861px){ .mob-head{display:none} }
@media(max-width:420px){
    .g-kpi{grid-template-columns:1fr 1fr;gap:11px}
    .card{padding:17px}
}
/* ══════════════════════════════════════════════════════════════════════════
   MOBILE — même page, échelle réduite. Aucun composant spécifique : la
   densité vient de l'absence de cadres, pas d'un traitement séparé.
   ══════════════════════════════════════════════════════════════════════════ */
@media(max-width:860px){
    .main{padding:16px 20px 96px}
    /* En-tête : une ligne d'identité sobre, sans surface sombre. */
    .mob-head{
        display:flex;align-items:center;gap:11px;background:none;color:var(--ink);
        padding:0;margin-bottom:26px;border-radius:0;
    }
    .mob-head .brand-mark{width:30px;height:30px;font-size:13px;border-radius:9px}
    #mobName{font-size:14.5px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
    #mobTier{font-size:12px;font-weight:500;color:var(--muted);line-height:1.3}
    /* Le prénom est déjà juste au-dessus. */
    .topline{display:none}
    .sec + .sec{margin-top:38px}
    .rule{margin:22px 0}
    .amount{font-size:42px;margin-top:11px}
    .amount-note{font-size:13.5px;margin-top:8px}
    .line-status{font-size:12.5px}
    .unlock-need,.unlock-reward{font-size:13.5px}
    .unlock-line{gap:12px}
    .act{padding:15px 0;gap:12px}
    .act-label{font-size:15px}
    .act-desc{font-size:13px}
    /* Trois chiffres restent lisibles côte à côte jusqu'à 360px. */
    .stats-row{gap:16px}
    .stat-k{font-size:11.5px}
    .stat-v{font-size:19px;margin-top:5px}
    /* Le filet vertical ne tient pas en une colonne : il devient horizontal. */
    .minor{grid-template-columns:1fr;gap:30px}
    .minor > div + div{
        padding-left:0;border-left:none;margin-left:0;
        padding-top:30px;border-top:1px solid var(--line);
    }
    .promo-code-l{font-size:26px}
    .card + .card{margin-top:32px}
    .card-title{font-size:16px}
}
@media(max-width:360px){
    .main{padding:16px 16px 96px}
    .amount{font-size:37px}
    .stats-row{gap:12px}
    .stat-v{font-size:17px}
    .stat-k{font-size:11px}
}
@media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="shell">
    <!-- ══ SIDEBAR ══ -->
    <aside class="side">
        <div class="side-brand">
            <div class="brand-mark">V</div>
            <div>
                <div class="brand-name">Volakits</div>
                <div class="brand-sub">Ambassadeurs</div>
            </div>
        </div>

        <div class="side-user">
            <div class="side-avatar" id="sideAvatar">–</div>
            <div class="side-user-info">
                <div class="side-user-name" id="sideName">Chargement…</div>
                <div class="side-user-tier" id="sideTier"></div>
            </div>
        </div>

        <nav class="nav-group">
            <div class="nav-label">Mon espace</div>
            <button class="nav-item active" data-tab="home">
                <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1V9.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>

            </button>
            <button class="nav-item" data-tab="missions">
                <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke-linecap="round" stroke-linejoin="round"/></svg>

            <button class="nav-item" data-tab="colis">
                <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z M3.3 7L12 12l8.7-5M12 22V12" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Mon colis

        </nav>

        <nav class="nav-group">
            <div class="nav-label">Progression</div>
            <button class="nav-item" data-tab="paliers">
                <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9H4.5a2.5 2.5 0 010-5H6M18 9h1.5a2.5 2.5 0 000-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0012 0V2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Avantages
            </button>
        </nav>

        <nav class="nav-group">
            <div class="nav-label">Mon profil</div>
            <button class="nav-item" data-tab="profil">
                <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Mes informations
            </button>
            <button class="nav-item" data-tab="contenus">
                <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M23 7l-7 5 7 5V7zM14 5H3a2 2 0 00-2 2v10a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Mes contenus
            </button>
        </nav>

        <div class="side-foot">
            <p class="side-help">Une question ?<br><a href="#" id="helpLink">Contacte l'équipe Volakits</a></p>
        </div>
    </aside>

    <!-- ══ CONTENU ══ -->
    <main class="main">
        <div class="wrap">
            <!-- Header mobile -->
            <div class="mob-head">
                <div class="brand-mark">V</div>
                <div style="flex:1;min-width:0">
                    <div id="mobName">Mon espace</div>
                    <div id="mobTier"></div>
                </div>
            </div>

            <div class="topline">
                <div class="hello">
                    <h1 id="greeting">Chargement…</h1>
                </div>
            </div>

            <div id="view"></div>
        </div>
    </main>
</div>

<div class="mob-nav">
    <button class="mob-item active" data-tab="home">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1V9.5z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Accueil
    </button>
    <button class="mob-item" data-tab="missions">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Missions
    </button>
    <button class="mob-item" data-tab="colis">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Colis
    </button>
    <button class="mob-item" data-tab="paliers">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2H6v7a6 6 0 0012 0V2zM4 22h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Avantages
    </button>
    <button class="mob-item" data-tab="contenus">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l4.55-2.28A1 1 0 0121 8.62v6.76a1 1 0 01-1.45.9L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Vidéos
    </button>
    <button class="mob-item" data-tab="profil">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Profil
    </button>
</div>

<div class="toast" id="toast"></div>

<script>
const SLUG = {{ slug|tojson }};
let D = null;          // données de l'espace
let TAB = 'home';

const ICO = {
  eye:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>',
  cart:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  euro:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10h10M4 14h9M18 6a7 7 0 100 12" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  play:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7zM14 5H3a2 2 0 00-2 2v10a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2z" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  checkS:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="3"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  lock:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>',
  box:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  target:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
  tag:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.5L12 22l-9-9V3h10l7.6 7.6a2 2 0 010 2.9z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.5" cy="7.5" r="1.5" fill="currentColor"/></svg>',
  trophy:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2H6v7a6 6 0 0012 0V2zM4 22h16M10 17c0 1.7-1 3.4-3 5M14 17c0 1.7 1 3.4 3 5" stroke-linecap="round" stroke-linejoin="round"/></svg>',

// ── Chargement ──────────────────────────────────────────────────────────
async function load(){
    try{
        const r = await fetch(`/api/espace/${SLUG}`);
        if(!r.ok) throw new Error('404');
        D = await r.json();
        paintChrome();
        render();
    }catch(e){
        document.getElementById('view').innerHTML =
            `<div class="card"><div class="empty">
                <div class="empty-ico">${ICO.lock}</div>
                <div class="empty-title">Espace introuvable</div>
                <div class="empty-text">Ce lien n'est plus valide. Contacte l'équipe Volakits pour en recevoir un nouveau.</div>
            </div></div>`;
        document.getElementById('greeting').textContent = 'Oups';
    }
}

function paintChrome(){
    const name = D.influencer.pseudo || 'Ambassadeur';
    const initial = (name[0] || 'V').toUpperCase();
    const t = D.tier.current;

    document.getElementById('sideAvatar').textContent = initial;
    document.getElementById('sideName').textContent = name;
    document.getElementById('sideTier').innerHTML = `${t.icon} ${t.name}`;
    document.getElementById('mobName').textContent = name;
    document.getElementById('mobTier').textContent = `${t.icon} ${t.name}`;

    document.getElementById('greeting').innerHTML = `Salut ${esc(name)} 👋`;

    const todo = D.missions.filter(m=>!m.done).length;
    document.getElementById('navMissions').textContent = todo;
}

// ── Rendu par onglet ────────────────────────────────────────────────────
function render(){
    const v = document.getElementById('view');
    if(TAB === 'home')      v.innerHTML = viewHome();
    else if(TAB==='missions') v.innerHTML = viewMissions();
    else if(TAB==='colis')    v.innerHTML = viewColis();
    else if(TAB==='paliers')  v.innerHTML = viewPaliers();
    else if(TAB==='contenus') v.innerHTML = viewContenus();
    else if(TAB==='profil'){
        v.innerHTML = viewProfil();
        ensureCatalog().then(renderJerseyGrid);
        const sb = document.getElementById('profilSave');
        if(sb) sb.onclick = saveProfil;
    }
    requestAnimationFrame(animate);
    bindDynamic();
}

function animate(){
    document.querySelectorAll('[data-fill]').forEach(el=>{
        el.style.width = el.getAttribute('data-fill') + '%';
    });
    countUp();
}

// Le montant des gains monte jusqu'à sa valeur : le chiffre le plus important
// de l'écran mérite d'attirer l'œil une seconde.
function countUp(){
    const el = document.getElementById('gainsV');
    if(!el) return;
    const c = D.commission_month;
    const target = c ? Math.round(c.amount) : 0;
    if(!target){ el.textContent = '€0'; return; }
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){ el.textContent = '€' + fmt(target); return; }
    let start = null;
    requestAnimationFrame(function step(t){
        if(!start) start = t;
        const p = Math.min(1, (t - start) / 900);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = '€' + fmt(Math.round(target * e));
        if(p < 1) requestAnimationFrame(step);
    });
}

// ── Gains du mois : la surface de marque ────────────────────────────────
function blockGains(){
    const c = D.commission_month, s = D.stats;
    const amount = c ? Math.round(c.amount) : 0;
    // Base de calcul — libellé allégé, il ne doit pas concurrencer le montant.
    let basis = '';
    if(c){
        if(c.type === 'fixed')      basis = `Fixe débloqué avec ${fmt(c.sales_month)} ventes`;
        else if(c.beats_fixed)      basis = `Commission de ${c.rate} % — au-dessus de ton fixe`;
        else                        basis = `Commission de ${c.rate} % sur tes ventes`;
    }
    return `<section class="gains rise">
        <div class="gains-k">Tes gains ce mois</div>
        <div class="gains-v num" id="gainsV">€0</div>
        ${basis ? `<div class="gains-sub">${esc(basis)}</div>` : ''}
        <div class="gains-sep"></div>

            <span class="num">${fmt(s.sales)} vente${s.sales > 1 ? 's' : ''}</span>
            <span class="d"></span>

            ${rankFact()}
        </div>
    </section>`;
}

// ── Classement ──────────────────────────────────────────────────────────
// Une position, rien d'autre : ni nom, ni chiffre d'un tiers. Elle prend
// place dans la ligne de faits existante plutôt que dans un bloc à elle —
// c'est une donnée de contexte, pas un écran.
function rankFact(){
    const r = D.rank;
    if(!r || !r.position) return '';
    const ord = r.position === 1 ? '1ᵉʳ' : r.position + 'ᵉ';
    return `<span class="d"></span><span class="num rank${r.podium ? ' rank-top' : ''}">${ord} sur ${fmt(r.total)}</span>`;
}

// ── Objectif : ce qu'il reste à faire, et ce que ça débloque ────────────
function blockGoal(){
    const c = D.commission_month, g = D.gifting_month, t = D.tier;
    if(!c) return '';

    // Récompenses restantes, regroupées quand elles tombent au même seuil.
    const pending = [];
    if(c.missing > 0 && c.next_gain && c.next_threshold)
        pending.push({at:c.next_threshold, label:`${fmt(c.next_gain)} € garantis`});
    if(g && !g.unlocked && g.missing > 0)
        pending.push({at:g.threshold, label:`${fmt(g.tier_jerseys)} maillots`});

    // Rail des paliers : position actuelle sur l'échelle complète.
    const total = (t.all || []).length;
    const rail = total ? `<div class="rail" title="${esc(t.current.name)}, palier ${t.index+1} sur ${total}">
        ${t.all.map((_,i)=>`<span class="rail-s ${i < t.index ? 'done' : i === t.index ? 'now' : ''}"></span>`).join('')}
        <span class="rail-l num">${t.index+1}/${total}</span>
    </div>` : '';

    const head = `<div class="goal-head"><div class="goal-k">Prochain objectif</div>${rail}</div>`;

    if(!pending.length){
        const got = g && g.unlocked
            ? `Tout est débloqué ce mois : ${fmt(g.jerseys)} maillots et ta rémunération.`
            : 'Tout est débloqué pour ce mois.';
        return `<section class="goal rise" style="animation-delay:.06s">
            ${head}<div class="goal-done">${esc(got)}</div>
        </section>`;
    }

    const byAt = {};
    pending.forEach(x => { (byAt[x.at] = byAt[x.at] || []).push(x.label); });
    const at = Math.min(...Object.keys(byAt).map(Number));
    const missing = Math.max(0, at - c.sales_month);
    const pct = at > 0 ? Math.min(100, Math.round(c.sales_month / at * 100)) : 0;
    const lock = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>`;

    // Fin de mois : le compte à rebours ne s'affiche que quand il change
    // quelque chose — objectif encore atteignable, échéance proche.
    const clk = D.month_clock || {};
    const days = Number(clk.days_left);
    const urgent = Number.isFinite(days) && days <= 5 && missing > 0;
    const deadline = urgent
        ? `<div class="goal-dl">${days <= 0
            ? 'Dernier jour du mois'
            : `Il reste ${fmt(days)} jour${days > 1 ? 's' : ''}`}</div>`
        : '';

    return `<section class="goal rise${urgent ? ' urgent' : ''}" style="animation-delay:.06s">
        ${head}
        <div class="goal-left">Plus que ${fmt(missing)} vente${missing > 1 ? 's' : ''}</div>
        <div class="goal-for">pour débloquer ta récompense de ce mois</div>
        ${deadline}
        <div class="rewards">
            ${byAt[at].map((l,i)=>`<span class="rw" style="animation-delay:${.32 + i*.1}s">${lock}${esc(l)}</span>`).join('')}
        </div>
        <div class="goal-bar"><div class="goal-fill" data-fill="${pct}"></div></div>
        <div class="goal-foot">
            <span class="goal-cnt num">${fmt(c.sales_month)} sur ${fmt(at)} ventes ce mois</span>
            <span class="goal-cta" data-goto="paliers">Comment débloquer
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </span>
        </div>
    </section>`;
}

// ── Évolution : seulement si l'historique existe vraiment ───────────────
function blockEvolution(){
    const h = (D.stats && D.stats.commission_history) || {};
    const months = Object.keys(h).sort();

    if(months.length < 2){
        return `<section class="sec rise" style="animation-delay:.24s">
            <div class="sec-k">Évolution</div>
            <div class="sec-t">Tes commissions mois par mois</div>
            <div class="chart-empty" style="margin-top:12px">
                <div class="chart-empty-t">Ton évolution apparaîtra ici</div>
                <div class="chart-empty-d">Continue à partager ton code : dès le mois prochain, tu verras ta progression.</div>
            </div>
        </section>`;
    }

    const pts = months.slice(-6).map(m => Number(h[m]) || 0);
    const W = 560, H = 76, max = Math.max(...pts, 1);
    const xy = pts.map((v,i) => `${(i/(pts.length-1))*W},${H-6-(v/max)*(H-16)}`);
    const lastY = H-6-(pts[pts.length-1]/max)*(H-16);
    const label = m => {
        const [y,mo] = m.split('-');
        return ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][Number(mo)-1] || m;
    };
    const shown = months.slice(-6);

    return `<section class="sec rise" style="animation-delay:.24s">
        <div class="sec-k">Évolution</div>
        <div class="sec-t">Tes commissions mois par mois</div>
        <div style="margin-top:12px">
            <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
                <polyline points="${xy.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="${W}" cy="${lastY}" r="3.5" fill="var(--accent)"/>
            </svg>
            <div class="spark-x"><span>${esc(label(shown[0]))}</span><span>${esc(label(shown[shown.length-1]))}</span></div>
        </div>
    </section>`;
}

// ── Colis ───────────────────────────────────────────────────────────────
function shipSteps(){
    const st = D.influencer.status || 0;
    const ts = (D.influencer.tracking_status||'').toLowerCase();
    // Étapes : commande → préparation → expédié → en transit → livré
    let reached = 0;
    if(st >= 3) reached = 1;                  // accord → commande
    if(st >= 4 || D.influencer.tracking) reached = 2;   // préparation/expédié
    if(D.influencer.tracking) reached = 3;
    if(ts === 'transit') reached = 4;
    if(ts === 'livre' || st >= 5) reached = 5;
    return [
        {label:'Commande enregistrée', i:1},
        {label:'En préparation',       i:2},
        {label:'Expédié',              i:3},
        {label:'En transit',           i:4},
        {label:'Livré',                i:5},
    ].map(s=>({...s, done: reached > s.i, current: reached === s.i}));
}

function shipTimelineCompact(){
    if(!D.influencer.tracking && (D.influencer.status||0) < 3){
        return `<div class="empty" style="padding:20px 10px">
            <div class="empty-ico">${ICO.box}</div>
            <div class="empty-title">Pas encore d'envoi</div>
            <div class="empty-text">Ton colis apparaîtra ici dès qu'il sera préparé.</div>
        </div>`;
    }
    const steps = shipSteps();
    return `<div class="ship">${steps.map(s=>`
        <div class="ship-step ${s.done?'done':''} ${s.current?'current':''}">
            <div class="ship-dot">${s.done?ICO.check:''}</div>
            <div><div class="ship-label">${s.label}</div></div>

        ${D.influencer.tracking ? `<div class="track-box">
            <span class="track-num">${esc(D.influencer.tracking)}</span>
            <a class="btn-ghost btn-sm" href="https://t.17track.net/fr#nums=${encodeURIComponent(D.influencer.tracking)}" target="_blank" rel="noopener">Suivre</a>
        </div>` : ''}`;
}

                ${v.orig_link?`<a class="btn-ghost btn-sm" href="${escAttr(v.orig_link)}" target="_blank" rel="noopener">Ouvrir</a>`:''}
            </div>`).join('')
        : `<div class="empty">
                <div class="empty-ico">${ICO.play}</div>
                <div class="empty-title">Aucun contenu pour l'instant</div>
                <div class="empty-text">Dès que tu publies une vidéo, ajoute son lien ici pour qu'elle compte dans ta progression.</div>
           </div>`}
    </div>`;
}

// ── Interactions ────────────────────────────────────────────────────────
function bindDynamic(){
    document.querySelectorAll('[data-copy]').forEach(b=>{
        b.onclick = ()=>{
            navigator.clipboard.writeText(b.getAttribute('data-copy'));
            // Retour visuel sur le bouton lui-même : plus direct qu'une notification.
            const lbl = b.querySelector('span'), ico = b.querySelector('svg');
            if(lbl && ico){
                b.classList.add('done');
                const t0 = lbl.textContent, i0 = ico.innerHTML;
                lbl.textContent = 'Copié';
                ico.innerHTML = '<path d="M20 6L9 17l-5-5"/>';
                setTimeout(()=>{ b.classList.remove('done'); lbl.textContent = t0; ico.innerHTML = i0; }, 1800);
            }else{
                toast('Code copié');
            }
        };
    });
    document.querySelectorAll('[data-goto]').forEach(b=>{
        b.onclick = ()=> setTab(b.getAttribute('data-goto'));
    });
    const add = document.getElementById('vAdd');
    if(add) add.onclick = addVideo;
}

async function addVideo(){
    const type = document.getElementById('vType').value;
    const link = document.getElementById('vLink').value.trim();
    if(!link){ toast('Ajoute le lien de ta vidéo'); return; }
    try{
        const r = await fetch(`/api/espace/${SLUG}/video`,{
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({type, link})
        });
        const d = await r.json();
        if(d.success){ toast('Vidéo ajoutée'); await load(); setTab('contenus'); }
        else toast('Erreur : ' + (d.error||''));
    }catch(e){ toast('Erreur réseau'); }
}

function setTab(t){
    TAB = t;
    document.querySelectorAll('[data-tab]').forEach(b=>{
        b.classList.toggle('active', b.getAttribute('data-tab')===t);
    });
    render();
    window.scrollTo({top:0, behavior:'smooth'});
}
document.querySelectorAll('[data-tab]').forEach(b=>{
    b.addEventListener('click', ()=> setTab(b.getAttribute('data-tab')));
});

let toastT=null;
function toast(msg){
    const el=document.getElementById('toast');
    el.textContent=msg; el.classList.add('show');
    clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2200);
}

// ── Vue : Mon profil ────────────────────────────────────────────────────
let CATALOG = null;      // {mode, jerseys:[]}
let PICKS = [];          // [{id,name,sub,size,image}]

async function ensureCatalog(){
    if(CATALOG) return;
    try{
        const r = await fetch(`/api/espace/${SLUG}/jerseys`);
        CATALOG = await r.json();
    }catch(e){ CATALOG = {mode:'stock', jerseys:[]}; }
}

const PLATFORMS = [
    {key:'tiktok',    name:'TikTok',    ico:'🎵', bg:'#F1F1F3'},
    {key:'instagram', name:'Instagram', ico:'📸', bg:'#FCEEF5'},
    {key:'snapchat',  name:'Snapchat',  ico:'👻', bg:'#FEF9E0'},
];

function viewProfil(){
    const inf = D.influencer;
    const p = inf.platforms || {};
    const sh = inf.shipping || {};
    PICKS = (inf.jerseys || []).map(j=>({...j}));

    return `
    <div class="card">
        <div class="card-head">
            <div>
                <div class="card-title"><span class="ico-box">${ICO.eye}</span>Tes réseaux</div>
                <div class="card-sub" style="margin-top:5px">Ces informations nous aident à adapter la collaboration</div>
            </div>
        </div>
        ${PLATFORMS.map(pl=>{
            const v = p[pl.key] || {};
            return `<div class="plat-block">
                <div class="plat-head">
                    <div class="plat-ico" style="background:${pl.bg}">${pl.ico}</div>
                    <div class="plat-name">${pl.name}</div>
                </div>
                <div class="plat-fields">
                    <div class="field">
                        <label>Pseudo</label>
                        <input data-p="${pl.key}" data-k="username" value="${escAttr(v.username||'')}" placeholder="@ton_pseudo">
                    </div>
                    <div class="field">
                        <label>Abonnés</label>
                        <input type="number" min="0" data-p="${pl.key}" data-k="followers" value="${v.followers||''}" placeholder="12000">
                    </div>
                    <div class="field">
                        <label>Vues moyennes</label>
                        <input type="number" min="0" data-p="${pl.key}" data-k="avg_views" value="${v.avg_views||''}" placeholder="8000">
                    </div>
                </div>
            </div>`;
        }).join('')}
    </div>

    <div class="card">
        <div class="card-head">
            <div>
                <div class="card-title"><span class="ico-box">${ICO.tag}</span>Choisis tes 2 maillots</div>
                <div class="card-sub" style="margin-top:5px">Sélectionne un modèle, puis sa taille</div>
            </div>
            <span class="pick-count ${PICKS.length>=2?'full':''}" id="pickCount">${PICKS.length} / 2</span>
        </div>
        <div id="pickedZone"></div>
        <div id="jerseyGrid"><div class="empty" style="padding:20px"><div class="empty-text">Chargement du catalogue…</div></div></div>
    </div>

    <div class="card">
        <div class="card-head">
            <div>
                <div class="card-title"><span class="ico-box">${ICO.box}</span>Adresse de livraison</div>
                <div class="card-sub" style="margin-top:5px">Pour t'envoyer ton colis</div>
            </div>
        </div>
        <div class="form-grid">
            <div class="field"><label>Prénom</label><input data-s="firstname" value="${escAttr(sh.firstname||'')}" placeholder="Lucas"></div>
            <div class="field"><label>Nom</label><input data-s="lastname" value="${escAttr(sh.lastname||'')}" placeholder="Martin"></div>
            <div class="field full"><label>Adresse</label><input data-s="address" value="${escAttr(sh.address||'')}" placeholder="18 rue du Puchot"></div>
            <div class="field"><label>Code postal</label><input data-s="postal" value="${escAttr(sh.postal||'')}" placeholder="76500"></div>
            <div class="field"><label>Ville</label><input data-s="city" value="${escAttr(sh.city||'')}" placeholder="Elbeuf"></div>
            <div class="field"><label>Pays</label><input data-s="country" value="${escAttr(sh.country||'France')}" placeholder="France"></div>
            <div class="field"><label>Téléphone</label><input data-s="phone" value="${escAttr(sh.phone||'')}" placeholder="06 12 34 56 78"></div>
            <div class="field full"><label>Email</label><input type="email" data-s="email" value="${escAttr(sh.email||'')}" placeholder="lucas@email.com"></div>
        </div>
    </div>

    <div class="sticky-save">
        <button class="btn" id="profilSave">Enregistrer mes informations</button>
    </div>`;
}

function renderJerseyGrid(){
    const el = document.getElementById('jerseyGrid');
    if(!el) return;
    const list = (CATALOG && CATALOG.jerseys) || [];
    if(!list.length){
        el.innerHTML = `<div class="empty" style="padding:24px 10px">
            <div class="empty-ico">${ICO.tag}</div>
            <div class="empty-title">Catalogue en cours de mise à jour</div>
            <div class="empty-text">Les maillots disponibles arrivent très vite. Reviens dans un moment.</div>
        </div>`;
        return;
    }
    el.innerHTML = `<div class="jgrid">${list.map(j=>{
        const pick = PICKS.find(p=>p.id===j.id);
        return `<div class="jcard ${pick?'sel':''}">
            <div class="jcard-tick">${ICO.check}</div>
            <img class="jcard-img" src="${escAttr(j.image)}" alt="${escAttr(j.name)}" loading="lazy">
            <div class="jcard-body">
                <div class="jcard-name">${esc(j.name)}</div>
                ${j.sub?`<div class="jcard-sub">${esc(j.sub)}</div>`:''}
                <div class="jsizes">
                    ${Object.entries(j.sizes).map(([s,q])=>
                        `<div class="jsize ${pick&&pick.size===s?'on':''} ${q>0?'':'out'}" data-size="${s}" data-jid="${escAttr(j.id)}">${s}</div>`
                    ).join('')}
                </div>
            </div>
        </div>`;
    }).join('')}</div>`;

    el.querySelectorAll('[data-size]').forEach(b=>{
        b.onclick = (e)=>{
            e.stopPropagation();
            if(b.classList.contains('out')) return;
            selectJersey(b.getAttribute('data-jid'), b.getAttribute('data-size'));
        };
    });
    renderPicked();
}

function selectJersey(jid, size){
    const j = CATALOG.jerseys.find(x=>x.id===jid);
    if(!j) return;
    const existing = PICKS.findIndex(p=>p.id===jid);
    if(existing >= 0){
        if(PICKS[existing].size === size) PICKS.splice(existing,1);
        else PICKS[existing].size = size;
    }else{
        if(PICKS.length >= 2){ toast('Tu as déjà choisi 2 maillots'); return; }
        PICKS.push({id:j.id, name:j.name, sub:j.sub, size, image:j.image});
    }
    const c = document.getElementById('pickCount');
    if(c){ c.textContent = `${PICKS.length} / 2`; c.classList.toggle('full', PICKS.length>=2); }
    renderJerseyGrid();
}

function renderPicked(){
    const z = document.getElementById('pickedZone');
    if(!z) return;
    if(!PICKS.length){ z.innerHTML=''; return; }
    z.innerHTML = `<div class="picked">${PICKS.map((p,i)=>`
        <div class="picked-item">
            <img class="picked-img" src="${escAttr(p.image||'')}" alt="">
            <div><div class="picked-name">${esc(p.name)}</div><div class="picked-size">Taille ${esc(p.size)}</div></div>
            <span class="picked-rm" data-rm="${i}">✕</span>
        </div>`).join('')}</div>`;
    z.querySelectorAll('[data-rm]').forEach(b=>{
        b.onclick = ()=>{
            PICKS.splice(+b.getAttribute('data-rm'),1);
            renderJerseyGrid();
            const c=document.getElementById('pickCount');
            if(c){c.textContent=`${PICKS.length} / 2`;c.classList.toggle('full',PICKS.length>=2);}
        };
    });
}

async function saveProfil(){
    const btn = document.getElementById('profilSave');
    btn.disabled = true; btn.textContent = 'Enregistrement…';

    const platforms = {};
    document.querySelectorAll('[data-p]').forEach(inp=>{
        const p = inp.getAttribute('data-p'), k = inp.getAttribute('data-k');
        platforms[p] = platforms[p] || {};
        const v = inp.value.trim();
        if(v) platforms[p][k] = (k==='username') ? v : (parseInt(v)||0);
    });
    Object.keys(platforms).forEach(k=>{ if(!Object.keys(platforms[k]).length) delete platforms[k]; });

    const shipping = {};
    document.querySelectorAll('[data-s]').forEach(inp=>{
        const v = inp.value.trim();
        if(v) shipping[inp.getAttribute('data-s')] = v;
    });

    try{
        const r = await fetch(`/api/espace/${SLUG}/update`,{
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({platforms, shipping, jerseys:PICKS})
        });
        let d = await r.json();

        // L'adresse de livraison est protégée par un code : si le serveur le
        // réclame, on le demande puis on rejoue l'enregistrement tel quel.
        // L'influenceur ne perd pas sa saisie.
        if(r.status === 403 && d.pin_required){
            const ok = await askPin();
            if(!ok){
                btn.disabled=false; btn.textContent='Enregistrer mes informations';
                return;
            }
            const r2 = await fetch(`/api/espace/${SLUG}/update`,{
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({platforms, shipping, jerseys:PICKS})
            });
            d = await r2.json();
        }

        if(d.success){ toast('Informations enregistrées ✓'); await load(); setTab('profil'); }
        else toast('Erreur : ' + (d.error||''));
    }catch(e){ toast('Erreur réseau'); }
    finally{ btn.disabled=false; btn.textContent='Enregistrer mes informations'; }
}

// ── Code d'accès ────────────────────────────────────────────────────────
// Demandé uniquement pour écrire l'adresse de livraison. La consultation de
// l'espace reste libre : ajouter une porte à l'entrée ferait fuir, alors que
// le risque réel se limite au détournement du colis.
function askPin(){
    return new Promise(resolve=>{
        const wrap = document.createElement('div');
        wrap.className = 'pin-back';
        wrap.innerHTML = `
            <div class="pin-box" role="dialog" aria-modal="true" aria-label="Code d'accès">
                <div class="pin-t">Confirme ton code</div>
                <div class="pin-d">Pour modifier ton adresse de livraison, saisis le code à 4 chiffres transmis par l'équipe Volakits.</div>
                <input class="pin-in num" id="pinIn" inputmode="numeric" autocomplete="one-time-code"
                       maxlength="4" placeholder="0000" aria-label="Code à 4 chiffres">
                <div class="pin-err" id="pinErr"></div>
                <div class="pin-acts">
                    <button class="pin-ghost" id="pinCancel">Annuler</button>
                    <button class="btn" id="pinOk">Confirmer</button>
                </div>
            </div>`;
        document.body.appendChild(wrap);

        const input  = wrap.querySelector('#pinIn');
        const errEl  = wrap.querySelector('#pinErr');
        const okBtn  = wrap.querySelector('#pinOk');
        setTimeout(()=>input.focus(), 40);

        const close = v => { wrap.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
        const onKey = e => { if(e.key === 'Escape') close(false); };
        document.addEventListener('keydown', onKey);

        input.addEventListener('input', ()=>{
            input.value = input.value.replace(/\D/g,'').slice(0,4);
            errEl.textContent = '';
        });
        input.addEventListener('keydown', e=>{ if(e.key === 'Enter') okBtn.click(); });
        wrap.querySelector('#pinCancel').addEventListener('click', ()=> close(false));
        wrap.addEventListener('click', e=>{ if(e.target === wrap) close(false); });

        okBtn.addEventListener('click', async ()=>{
            const pin = input.value.trim();
            if(pin.length !== 4){ errEl.textContent = 'Le code fait 4 chiffres.'; return; }
            okBtn.disabled = true; okBtn.textContent = 'Vérification…';
            try{
                const r = await fetch(`/api/espace/${SLUG}/verify`,{
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({pin})
                });
                const d = await r.json();
                if(d.success) return close(true);
                errEl.textContent = d.error || 'Code incorrect.';
                if(d.locked) return setTimeout(()=> close(false), 1600);
                input.value = ''; input.focus();
            }catch(e){ errEl.textContent = 'Erreur réseau.'; }
            finally{ okBtn.disabled = false; okBtn.textContent = 'Confirmer'; }
        });
    });
}

// ── Utils ───────────────────────────────────────────────────────────────
function fmt(n){
    n = Number(n)||0;
    if(n >= 1000000) return (n/1000000).toFixed(1).replace('.0','')+'M';
    if(n >= 1000)    return (n/1000).toFixed(1).replace('.0','')+'K';
    return String(n);
}
function fmtDate(iso){
    const d=new Date(iso);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'2-digit'});
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

load();
