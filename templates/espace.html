</div>

<div class="toast" id="toast"></div>
<div class="tk-loupe" id="tkLoupe"><img id="tkLoupeImg" alt="Capture agrandie"></div>

<script>
const SLUG = {{ slug|tojson }};
let D = null;          // données de l'espace
let TAB = 'home';

const ICO = {
  chevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  eye:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>',
  cart:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  euro:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10h10M4 14h9M18 6a7 7 0 100 12" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  play:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7zM14 5H3a2 2 0 00-2 2v10a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2z" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  checkS:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="3"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  lock:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>',
  box:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  target:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
  tag:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.5L12 22l-9-9V3h10l7.6 7.6a2 2 0 010 2.9z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.5" cy="7.5" r="1.5" fill="currentColor"/></svg>',
  trophy:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2H6v7a6 6 0 0012 0V2zM4 22h16M10 17c0 1.7-1 3.4-3 5M14 17c0 1.7 1 3.4 3 5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
};

// ── Chargement ──────────────────────────────────────────────────────────
async function load(){
    try{
        const r = await fetch(`/api/espace/${SLUG}`);
        if(!r.ok) throw new Error('404');
        D = await r.json();
        paintChrome();
        const voulu = ongletDepuisAdresse();
        if(voulu && !LIGHT_HIDDEN.includes(voulu) || (voulu && !isLight())) TAB = voulu;
        render();
    }catch(e){
        // Une coupure réseau de deux secondes affichait « Espace introuvable » :
        // on croyait être sortie du programme. Seul un vrai 404 le dit.
        const introuvable = String(e.message) === '404';
        document.getElementById('view').innerHTML =
            `<div class="card"><div class="empty">
                <div class="empty-ico">${introuvable ? ICO.lock : ICO.warn}</div>
                <div class="empty-title">${introuvable ? 'Espace introuvable' : 'Connexion interrompue'}</div>
                <div class="empty-text">${introuvable
                    ? "Ce lien n'est plus valide. Écris-nous pour en recevoir un nouveau."
                    : "On n'arrive pas à charger ton espace. Vérifie ta connexion — rien n'est perdu."}</div>
                ${introuvable ? '' : `<button class="btn" style="margin-top:16px" onclick="load()">Réessayer</button>`}
            </div></div>`;
        document.getElementById('greeting').textContent = introuvable ? 'Oups' : 'Un instant';
    }
}

/* Vendeur hors boutique : il n'a ni colis, ni maillots, ni missions à
   accomplir. Les onglets correspondants ne sont pas grisés mais retirés —
   un onglet vide donne l'impression d'un espace incomplet, pas d'un espace
   fait pour lui. Restent ses gains, son objectif et son classement. */
const LIGHT_HIDDEN = ['missions','colis','profil','contenus'];
function isLight(){ return !!(D && D.influencer && D.influencer.light); }

function applyLight(){
    if(!isLight()) return;
    document.querySelectorAll('[data-tab]').forEach(b=>{
        if(LIGHT_HIDDEN.includes(b.getAttribute('data-tab'))) b.remove();
    });
    // Les libellés de groupe du menu latéral n'ont plus rien à annoncer.
    document.querySelectorAll('.nav-group').forEach(g=>{
        if(!g.querySelector('.nav-item')) g.remove();
    });
    if(LIGHT_HIDDEN.includes(TAB)) TAB = 'home';
}

function paintChrome(){
    applyLight();
    const name = D.influencer.pseudo || 'Ambassadeur';
    const initial = (name[0] || 'V').toUpperCase();
    const t = D.tier.current;

    document.getElementById('sideAvatar').textContent = initial;
    document.getElementById('sideName').textContent = name;
    const label = isLight() ? 'Vendeur partenaire' : `${t.icon} ${t.name}`;
    document.getElementById('sideTier').innerHTML = label;
    document.getElementById('mobName').textContent = name;
    document.getElementById('mobTier').textContent = label;

    document.getElementById('greeting').innerHTML = `Salut ${esc(name)} 👋`;

    // Le seul point de contact de l'espace pointait sur « # » et ne faisait
    // rien. Sans numéro configuré côté serveur, on n'affiche pas de lien mort.
    const aide = document.getElementById('helpLink');
    const url  = (D.contact && D.contact.url) || '';
    if(aide){
        if(url){
            aide.href = url;
            aide.target = '_blank';
            aide.rel = 'noopener';
            aide.textContent = "Écris à l'équipe Volakits";
        }else{
            aide.parentElement.style.display = 'none';
        }
    }

    const badge = document.getElementById('navMissions');
    if(badge) badge.textContent = D.missions.filter(m=>!m.done).length;
}

// ── Rendu par onglet ────────────────────────────────────────────────────
function render(){
    const v = document.getElementById('view');
    try{
        peindreVue(v);
    }catch(e){
        // Une donnée manquante ne doit pas laisser l'écran figé sur l'onglet
        // précédent, ni se faire passer pour une coupure réseau : elle a bien
        // du réseau, c'est nous qui n'arrivons pas à afficher.
        console.error('[espace] rendu impossible', e);
        v.innerHTML = `<div class="empty" style="padding:44px 18px">
            <div class="empty-ico">${ICO.alert || ''}</div>
            <div class="empty-title">On n'arrive pas à afficher cette page</div>
            <div class="empty-text">Ce n'est pas ta connexion — on est prévenus.
                Essaie un autre onglet en attendant.</div>
        </div>`;
    }
    requestAnimationFrame(animate);
    bindDynamic();
    bindMissions();
    const gv = document.getElementById('gdVersContenus');
    if(gv) gv.onclick = ()=> setTab('contenus');
    // La vignette dit où appuyer ; l'agrandissement lève le doute quand elle
    // ne reconnaît pas l'écran.
    document.querySelectorAll('[data-zoom]').forEach(b=>{
        b.onclick = ()=>{
            document.getElementById('tkLoupeImg').src =
                `/static/guide-${b.getAttribute('data-zoom')}.jpg`;
            document.getElementById('tkLoupe').classList.add('on');
        };
    });
}

/* La loupe se ferme au doigt comme au clavier. Posée une seule fois : elle
   vit hors de la vue, qui est reconstruite à chaque changement d'onglet. */
(function(){
    const l = document.getElementById('tkLoupe');
    if(!l) return;
    l.onclick = ()=> l.classList.remove('on');
    document.addEventListener('keydown', e=>{
        if(e.key === 'Escape') l.classList.remove('on');
    });
})();

function peindreVue(v){
    if(TAB === 'home')      v.innerHTML = viewHome();
    else if(TAB==='missions') v.innerHTML = viewMissions();
    else if(TAB==='colis')    v.innerHTML = viewColis();
    else if(TAB==='paliers'){ v.innerHTML = viewPaliers(); bindPaliers(); }
    else if(TAB==='contenus') v.innerHTML = viewContenus();
    else if(TAB==='profil'){
        v.innerHTML = viewProfil();
        const sb = document.getElementById('profilSave');
        if(sb) sb.onclick = saveProfil;
    }
}

function animate(){
    document.querySelectorAll('[data-fill]').forEach(el=>{
        el.style.width = el.getAttribute('data-fill') + '%';
    });
    countUp();
}

// Le montant des gains monte jusqu'à sa valeur : le chiffre le plus important
// de l'écran mérite d'attirer l'œil une seconde.
function countUp(){
    const el = document.getElementById('gainsV');
    if(!el) return;
    const c = D.commission_month;
    const target = c ? Math.round(c.amount) : 0;
    if(!target){ el.textContent = '€0'; return; }
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){ el.textContent = '€' + fmt(target); return; }
    let start = null;
    requestAnimationFrame(function step(t){
        if(!start) start = t;
        const p = Math.min(1, (t - start) / 900);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = '€' + fmt(Math.round(target * e));
        if(p < 1) requestAnimationFrame(step);
    });
}

// ── Vue : Tableau de bord ───────────────────────────────────────────────
function viewHome(){
    return `
    ${blockGains()}
    ${blockGoal()}
    ${isLight() ? '' : blockTasks()}
    ${blockPromo()}
    ${blockRank()}
    ${blockEvolution()}
    ${isLight() ? '' : blockColis()}`;
}


/* Dates de la période de rémunération, en clair.
   Un influenceur inscrit le 12 ne doit jamais avoir à deviner que sa période
   court du 12 au 12 : on écrit les dates plutôt que « le mois ». */
function periodDates(){
    const c = D.month_clock || {};
    if(!c.start || !c.end) return null;
    const f = iso => {
        const d = new Date(iso + 'T00:00:00Z');
        return isNaN(d) ? null : d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', timeZone:'UTC'});
    };
    const a = f(c.start), b = f(c.end);
    return (a && b) ? {from:a, to:b, anchored:!!c.anchored} : null;
}
function periodLabel(){
    const p = periodDates();
    return p ? `du ${p.from} au ${p.to}` : 'de ce mois';
}

// ── Gains du mois : la surface de marque ────────────────────────────────
function blockGains(){
    const c = D.commission_month, s = D.stats;
    const amount = c ? Math.round(c.amount) : 0;
    // Base de calcul — libellé allégé, il ne doit pas concurrencer le montant.
    let basis = '';
    if(c){
        if(c.type === 'fixed')      basis = `Fixe débloqué avec ${fmt(c.sales_month)} ventes`;
        else if(c.beats_fixed)      basis = `Commission de ${c.rate} % — au-dessus de ton fixe`;
        else                        basis = `Commission de ${c.rate} % sur tes ventes`;
    }
    return `<section class="gains rise">
        <div class="gains-k">Tes gains sur ta période</div>
        <div class="gains-v num" id="gainsV">€0</div>
        ${basis ? `<div class="gains-sub">${esc(basis)}</div>` : ''}
        <div class="gains-sep"></div>
        ${/* Le chiffre d'affaires généré ne figure plus ici. Affiché à côté du
             nombre de ventes, il donnait le panier moyen par une simple
             division — et le panier moyen multiplié par le taux de commission
             donne ce que rapporte chaque maillot. Tout le travail fait sur
             l'écran Avantages pour ne pas exposer la rémunération par vente
             était annulé par cette seule ligne. */''}
        <div class="gains-facts">
            <span class="num">${fmt(s.sales)} vente${s.sales > 1 ? 's' : ''} au total</span>
            ${s.videos ? `<span class="d"></span><span class="num">${fmt(s.videos)} vidéo${s.videos > 1 ? 's' : ''}</span>` : ''}
        </div>
    </section>`;
}

/* Barre de pagination. Au-delà de cinq pages on n'affiche plus tous les
   numéros : la page courante, ses voisines, les extrémités, et des points de
   suspension. Une rangée de vingt chiffres serait illisible sur téléphone. */
function lbPager(pages, lignes){
    const cur = LB_PAGE;
    let nums = [];
    if(pages <= 5){
        for(let i = 0; i < pages; i++) nums.push(i);
    }else{
        const near = [0, cur - 1, cur, cur + 1, pages - 1]
            .filter(i => i >= 0 && i < pages);
        nums = [...new Set(near)].sort((a, b2) => a - b2);
    }
    let out = '', prev = -1;
    nums.forEach(i => {
        if(prev >= 0 && i - prev > 1) out += `<span class="lb-pdots">…</span>`;
        out += `<button class="lb-p${i === cur ? ' on' : ''}" data-lbp="${i}">${i + 1}</button>`;
        prev = i;
    });
    const de = cur * LB_PER + 1;
    const a  = Math.min(lignes.length, (cur + 1) * LB_PER);
    return `<div class="lb-pager">
        <button class="lb-p nav" data-lbp="${cur - 1}" ${cur === 0 ? 'disabled' : ''} aria-label="Page précédente">‹</button>
        ${out}
        <button class="lb-p nav" data-lbp="${cur + 1}" ${cur === pages - 1 ? 'disabled' : ''} aria-label="Page suivante">›</button>
        <span class="lb-prange num">${de}–${a} sur ${fmt(lignes.length)}</span>
    </div>`;
}

// ── Objectif : ce qu'il reste à faire, et ce que ça débloque ────────────
function blockGoal(){
    const c = D.commission_month, g = D.gifting_month, t = D.tier;
    if(!c) return '';

    // Récompenses restantes, regroupées quand elles tombent au même seuil.
    const pending = [];
    if(c.missing > 0 && c.next_gain && c.next_threshold)
        pending.push({at:c.next_threshold, label:`${fmt(c.next_gain)} € garantis`});
    // Les maillots du mois ne concernent que les ambassadrices : un vendeur
    // hors boutique n'a pas de colis, lui promettre des maillots serait faux.
    if(!isLight() && g && !g.unlocked && g.missing > 0)
        pending.push({at:g.threshold, label:`${fmt(g.tier_jerseys)} maillots`});

    // Rail des paliers : position actuelle sur l'échelle complète.
    const total = isLight() ? 0 : (t.all || []).length;
    const rail = total ? `<div class="rail" title="${esc(t.current.name)}, palier ${t.index+1} sur ${total}">
        ${t.all.map((_,i)=>`<span class="rail-s ${i < t.index ? 'done' : i === t.index ? 'now' : ''}"></span>`).join('')}
        <span class="rail-l num">${t.index+1}/${total}</span>
    </div>` : '';

    const head = `<div class="goal-head"><div class="goal-k">Prochain objectif</div>${rail}</div>`;

    if(!pending.length){
        const got = g && g.unlocked
            ? `Tout est débloqué sur ta période : ${fmt(g.jerseys)} maillots et ta rémunération.`
            : 'Tout est débloqué pour cette période.';
        return `<section class="goal rise" style="animation-delay:.06s">
            ${head}<div class="goal-done">${esc(got)}</div>
        </section>`;
    }

    const byAt = {};
    pending.forEach(x => { (byAt[x.at] = byAt[x.at] || []).push(x.label); });
    const at = Math.min(...Object.keys(byAt).map(Number));
    const missing = Math.max(0, at - c.sales_month);
    const pct = at > 0 ? Math.min(100, Math.round(c.sales_month / at * 100)) : 0;
    const lock = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>`;

    // Fin de mois : le compte à rebours ne s'affiche que quand il change
    // quelque chose — objectif encore atteignable, échéance proche.
    const clk = D.month_clock || {};
    const days = Number(clk.days_left);
    const urgent = Number.isFinite(days) && days <= 5 && missing > 0;
    const deadline = urgent
        ? `<div class="goal-dl">${days <= 0
            ? 'Dernier jour de ta période'
            : `Il reste ${fmt(days)} jour${days > 1 ? 's' : ''}`}</div>`
        : '';

    return `<section class="goal rise${urgent ? ' urgent' : ''}" style="animation-delay:.06s">
        ${head}
        <div class="goal-left">Plus que ${fmt(missing)} vente${missing > 1 ? 's' : ''}</div>
        <div class="goal-for">pour débloquer ta récompense ${esc(periodLabel())}</div>
        ${deadline}
        <div class="rewards">
            ${byAt[at].map((l,i)=>`<span class="rw" style="animation-delay:${.32 + i*.1}s">${lock}${esc(l)}</span>`).join('')}
        </div>
        <div class="goal-bar"><div class="goal-fill" data-fill="${pct}"></div></div>
        <div class="goal-foot">
            <span class="goal-cnt num">${fmt(c.sales_month)} sur ${fmt(at)} ventes sur ta période</span>
            <span class="goal-cta" data-goto="paliers">Comment débloquer
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </span>
        </div>
    </section>`;
}

// ── Missions : formulées comme des bénéfices ────────────────────────────
// Les libellés viennent du back ; on n'ajoute qu'un pictogramme par mission.
const TASK_EMOJI = {profil:'📸', maillots:'👕', livraison:'📦', unboxing:'🎥', video1:'🎬', video2:'🎬'};
// (les identifiants viennent de DEFAULT_MISSIONS côté serveur)
function blockTasks(){
    const todo = (D.missions || []).filter(m => !m.done).slice(0, 3);
    if(!todo.length) return '';
    return `<section class="sec rise" style="animation-delay:.12s">
        <div class="sec-k">À faire maintenant</div>
        <div class="sec-t">${fmt(todo.length)} action${todo.length > 1 ? 's' : ''} pour avancer</div>
        <div style="margin-top:8px">

                <div class="task-e">${TASK_EMOJI[m.id] || '✨'}</div>

            </button>`).join('')}
        </div>
    </section>`;
}

// ── Code promo ──────────────────────────────────────────────────────────
function blockPromo(){
    const code = D.influencer.promo_code, s = D.stats;
    const share = D.influencer.share_link || {};
    // Vendeur hors boutique : il vend en direct, il n'a pas de code à diffuser.
    // Afficher « ton code arrive » lui promettrait une chose qui ne viendra pas.
    if(isLight() && !code) return '';
    if(!code){
        return `<section class="sec rise" style="animation-delay:.18s">
            <div class="sec-k">Ton code</div>
            <div class="sec-t">En préparation</div>
            <div class="promo-meta" style="margin-top:10px">Il arrive avec ton colis.</div>
        </section>`;
    }
    const copySvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
    // L'adresse s'affiche sans le protocole : c'est ainsi qu'on lit un lien de
    // bio, et « https:// » ne fait qu'allonger une ligne déjà à l'étroit.
    const pretty = (share.url || '').replace(/^https?:\/\//, '');

    return `<section class="sec rise" style="animation-delay:.18s">
        <div class="sec-k">Partage</div>
        <div class="sec-t">Ton lien et ton code</div>

        ${/* ── Un seul bloc pour les deux ──
             Le lien et le code sont la même chose sous deux formes. Deux
             cartes séparées les faisaient se concurrencer et doublaient le
             texte. Ici le lien passe devant — c'est celui qui travaille tout
             seul — et le code reste dessous, à sa juste place. */''}
        <div class="shr">
            ${share.url && share.ready ? `
            <div class="shr-main">
                <div class="shr-k">Ton lien de vente</div>
                <div class="shr-row">
                    <a class="shr-url" href="${escAttr(share.url)}" target="_blank" rel="noopener"
                       title="Ouvrir pour tester">${esc(pretty)}</a>
                    <button class="copy-btn" data-copy="${escAttr(share.url)}">${copySvg}<span>Copier</span></button>
                </div>
                ${/* Une seule ligne, en retrait : le bénéfice puis le geste, sans
                     chiffre ni mention de vente. Un argument chiffré au-dessus
                     du lien alourdissait le bloc et ramenait la conversation
                     sur la performance, alors qu'il s'agit juste de dire à quoi
                     sert ce lien et où le mettre. */''}
                <div class="shr-why">Une vidéo peut s'arrêter de percer. Ton lien, lui, reste actif.<br>Ajoute-le à ta bio TikTok et Instagram pour continuer à générer des ventes, même entre deux vidéos.</div>
            </div>` : share.url ? `
            <div class="shr-main shr-wait">
                <div class="shr-k">À mettre en bio</div>
                <div class="shr-row"><span class="shr-soon">Ton lien arrive très vite</span></div>
                <div class="shr-why">On finalise l'activation de ton code côté boutique.</div>
            </div>` : ''}

            <div class="shr-code">
                <span class="shr-code-k">Ton code</span>
                <span class="shr-code-v">${esc(code)}</span>
                <button class="copy-btn ghost" data-copy="${escAttr(code)}">${copySvg}<span>Copier</span></button>
            </div>
        </div>

        <div class="promo-meta">
            <span>−15 % pour ta communauté</span>
            ${s.sales > 0 ? `<span class="d"></span><span><b class="num">${fmt(s.sales)} vente${s.sales>1?'s':''}</b> générées</span>` : ''}
        </div>
    </section>`;
}

/* Initiale de la pastille. Une seule lettre, et la première qui en est une :
   beaucoup de pseudos commencent par un underscore ou un point, et « _ » dans
   un rond ne dit rien de personne. */
function lbInitiale(nom){
    const c = String(nom || '').replace(/[^\p{L}\p{N}]/gu, '');
    // Pseudo trop court pour qu'on en montre une lettre : un point neutre
    // plutôt qu'un « ? », qui se lisait comme une erreur de chargement.
    return (c[0] || '•').toUpperCase();
}
// Fenêtre de 30 jours glissants, la même pour tout le monde — surtout pas la
// période de rémunération personnelle, qui commence au jour d'inscription :
// comparer une période entamée le 3 à une période entamée le 27 classerait
// sur la date d'entrée autant que sur le travail fourni.
//
// Ce qui s'affiche : un pseudo et un nombre de ventes. Jamais un euro — un
// montant permettrait de remonter à ce que touche l'autre.
function blockRank(){
    const b = D.leaderboard;
    if(!b) return '';

    // Pas encore de classement : on l'annonce quand même. Faire disparaître
    // le bloc laisserait croire à une fonction absente ou cassée, alors qu'il
    // ne manque qu'une vente ou un participant.
    if(b.empty){
        return `<section class="sec rise" style="animation-delay:.21s">
            <div class="sec-k">Classement</div>
            <div class="sec-t">Ton classement arrive</div>
            <div class="chart-empty" style="margin-top:12px">
                <div class="chart-empty-t">Où tu te situes face aux autres</div>
                <div class="chart-empty-d">Il s'affichera dès que le programme comptera ${fmt(b.need || 3)} participants.</div>
            </div>
        </section>`;
    }

    if(!b.rows || !b.rows.length) return '';

    // Tout le monde figure au tableau, y compris sans vente : voir la liste
    // complète des participantes fait partie de ce que le classement doit
    // montrer. Elles sont paginées comme les autres, pas regroupées.
    const pages = Math.max(1, Math.ceil(b.rows.length / LB_PER));
    if(LB_PAGE >= pages) LB_PAGE = pages - 1;
    if(LB_PAGE < 0) LB_PAGE = 0;

    let vue = b.rows.slice(LB_PAGE * LB_PER, (LB_PAGE + 1) * LB_PER);

    // Sa propre ligne reste visible où qu'on soit dans le tableau : épinglée
    // en bas quand elle n'est pas sur la page affichée. Naviguer dans le
    // classement ne doit jamais faire perdre de vue sa propre place.
    const moi = b.rows.find(r => r.is_me);
    if(b.me_row) vue = vue.concat([{gap:true}, b.me_row]);
    else if(moi && vue.indexOf(moi) === -1) vue = vue.concat([{gap:true}, moi]);

    // Échelle des barres : le leader fait la largeur pleine, tout le reste se
    // lit par rapport à lui. Sans référence commune, une barre ne dit rien.
    const tete = Math.max(1, ...b.rows.map(r => Number(r.sales) || 0));

    const rows = vue.map(r => {
        if(r.gap) return `<div class="lb-gap">•••</div>`;
        // Le doré ne va qu'à une vraie première place. Sans cette condition,
        // un programme où personne n'a encore vendu couronnait tout le monde :
        // à égalité à zéro, chacun est « 1er ».
        const cls = [r.is_me ? 'me' : '',
                     (r.position === 1 && !r.unranked) ? 'p1' : '',
                     r.unranked ? 'out' : '',
                     r.anon ? 'anon' : ''].filter(Boolean).join(' ');
        // Tout le monde a une place, y compris à zéro vente : le classement
        // doit ressembler à un classement. Le chiffre reste affiché dans les
        // deux cas, simplement en retrait quand il vaut zéro — un « 0 » gris
        // se lit comme un point de départ, pas comme un constat d'échec.
        const pos = r.position || '–';
        const val = `<span class="lb-n num">${fmt(r.sales || 0)}<span class="lb-u">vente${(r.sales || 0) > 1 ? 's' : ''}</span></span>`;
        // La barre part à zéro et s'anime jusqu'à sa largeur au premier rendu :
        // le tableau se remplit sous les yeux plutôt que d'apparaître figé.
        const pct = r.unranked ? 0 : Math.max(5, Math.round((r.sales / tete) * 100));
        return `<div class="lb-r ${cls}">
            <span class="lb-pos num">${pos}</span>
            <span class="lb-av">${esc(lbInitiale(r.pseudo))}</span>
            <div class="lb-mid">
                <div class="lb-nrow">
                    ${/* La fin du pseudo est un leurre envoyé par le serveur, pas
                         le vrai texte flouté : le flou n'est qu'un effet visuel,
                         il ne cache rien à qui inspecte la page. Ce qu'on floute
                         ici ne veut donc rien dire, et c'est le but. */''}
                    <span class="lb-name">${esc(r.pseudo)}${r.blur
                        ? `<span class="lb-blur" aria-hidden="true">${esc(r.blur)}</span>` : ''}</span>
                    ${(r.plats && r.plats.length)
                        ? `<span class="lb-plats" title="Active sur ${r.plats.length} plateforme${r.plats.length>1?'s':''}">${r.plats.map(platIcon).join('')}</span>`
                        : ''}
                    ${r.is_me ? `<span class="lb-me-tag">Toi</span>` : ''}
                </div>
                ${r.unranked ? '' : `<div class="lb-track"><i class="lb-bar" data-fill="${pct}"></i></div>`}
            </div>
            ${val}
        </div>`;
    }).join('');

    // Le sous-titre dit la place, pas la performance : « 4e sur 12 » se lit
    // sans avoir à compter les lignes. Sans vente, il annonce simplement ce
    // que le tableau montre : les meilleurs du moment.
    // Quand personne n'a encore vendu, le tableau est une grille de départ :
    // le dire ainsi vaut mieux que d'annoncer une place que personne n'occupe.
    const aucune = b.rows.every(r => r.unranked);
    const titre = (b.position && !b.unranked)
        ? `Ta ${b.position === 1 ? '1ʳᵉ place' : b.position + 'ᵉ place'} sur ${fmt(b.total)}`
        : aucune
        ? 'Tout le monde est à égalité — la première vente prend la tête'
        : 'Les meilleurs influenceurs du mois';

    return `<section class="sec rise" style="animation-delay:.21s">
        <div class="sec-k">Classement</div>
        <div class="sec-t">${esc(titre)}</div>
        <div class="lb">${rows}</div>
        ${pages > 1 ? lbPager(pages, b.rows) : ''}
        <div class="lb-foot">Sur les ventes des 30 derniers jours, la même fenêtre pour tout le monde.
            Les pseudos des autres sont masqués.</div>
    </section>`;
}

// ── Évolution : seulement si l'historique existe vraiment ───────────────
function blockEvolution(){
    const h = (D.stats && D.stats.commission_history) || {};
    const months = Object.keys(h).sort();

    if(months.length < 2){
        return `<section class="sec rise" style="animation-delay:.24s">
            <div class="sec-k">Évolution</div>
            <div class="sec-t">Tes commissions mois par mois</div>
            <div class="chart-empty" style="margin-top:12px">
                <div class="chart-empty-t">Ton évolution apparaîtra ici</div>
                <div class="chart-empty-d">Continue à partager ton code : dès le mois prochain, tu verras ta progression.</div>
            </div>
        </section>`;
    }

    const pts = months.slice(-6).map(m => Number(h[m]) || 0);
    const W = 560, H = 76, max = Math.max(...pts, 1);
    const xy = pts.map((v,i) => `${(i/(pts.length-1))*W},${H-6-(v/max)*(H-16)}`);
    const lastY = H-6-(pts[pts.length-1]/max)*(H-16);
    const label = m => {
        const [y,mo] = m.split('-');
        return ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][Number(mo)-1] || m;
    };
    const shown = months.slice(-6);
    // Une courbe sans un seul chiffre ne répond pas à « combien j'ai touché
    // le mois dernier » — la question qui partait en message.
    const cumul = Number((D.stats && D.stats.commission) || 0);

    return `<section class="sec rise" style="animation-delay:.24s">
        <div class="sec-k">Évolution</div>
        <div class="sec-t">Tes commissions mois par mois</div>
        <div style="margin-top:12px">
            <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
                <polyline points="${xy.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="${W}" cy="${lastY}" r="3.5" fill="var(--accent)"/>
            </svg>
            <div class="spark-x"><span>${esc(label(shown[0]))}</span><span>${esc(label(shown[shown.length-1]))}</span></div>
        </div>
        <div class="evo">
            ${shown.map((m,i)=>`<div class="evo-c ${i===shown.length-1?'now':''}">
                <div class="evo-m">${esc(label(m))}</div>
                <div class="evo-v">${eur(pts[i])}</div>
            </div>`).join('')}
        </div>
        <div class="evo-tot">Depuis ton entrée dans le programme : <b>${eur(cumul)}</b></div>
    </section>`;
}

// ── Colis ───────────────────────────────────────────────────────────────
function blockColis(){
    const inf = D.influencer;
    const st  = inf.tracking_status || '';
    const LABEL = {prepare:'En préparation', envoye:'En route vers toi',
                   transit:'En route vers toi', livre:'Livré',
                   probleme:'Un souci sur ton colis'};
    const title = LABEL[st] || 'Pas encore expédié';

    // L'étape franchie, sur les cinq du parcours d'expédition.
    const steps = shipSteps();
    const done  = steps.filter(x=>x.done).length;
    const cur   = steps.find(x=>x.current);
    const total = steps.length;

    // Ce qui bloque, dit en une phrase, et l'action qui débloque. Un état
    // sans action à faire laisse l'influenceur sans prise : on nomme donc
    // toujours l'étape suivante, même quand elle est de notre côté.
    const jerseysDone = (inf.jerseys || []).length >= 2;
    const addrDone    = !!(inf.shipping && (inf.shipping.address || inf.address));
    let msg, cta = null;
    if(st === 'livre')          msg = 'Ton colis est arrivé. Il ne reste plus qu\'à filmer.';
    else if(st === 'probleme')  msg = 'On regarde ce qui s\'est passé et on revient vers toi.';
    else if(inf.tracking)       msg = 'Ton colis est parti. Tu peux suivre son trajet.';
    else if(!jerseysDone)     { msg = 'On enregistre tes 2 maillots avec toi, puis le colis part.';
                                cta = {label:'Voir mes maillots', tab:'colis'}; }
    else if(!addrDone)        { msg = 'Renseigne ton adresse et ton colis part.';
                                cta = {label:'Renseigner mon adresse', tab:'profil'}; }
    else                        msg = 'Tout est bon de ton côté. On prépare ton colis.';

    return `<section class="sec rise" style="animation-delay:.3s">
        <div class="sec-k">Ton colis</div>
        <div class="sec-t">${esc(title)}</div>
        <div class="pk">
            <div class="pk-top">
                <div class="pk-msg">${esc(msg)}</div>
                <div class="pk-step">${fmtFull(Math.max(done, cur ? done+1 : done))} <span>/ ${fmtFull(total)}</span></div>
            </div>
            <div class="pk-track">
                ${steps.map(x=>`<span class="pk-seg ${x.done?'done':''} ${x.current?'now':''}"
                    title="${escAttr(x.label)}"></span>`).join('')}
            </div>
            <div class="pk-foot">
                <span class="pk-now">${esc((cur || steps.find(x=>!x.done) || steps[steps.length-1]).label)}</span>
                ${cta
                    ? `<button class="pk-cta" data-goto="${cta.tab}">${esc(cta.label)} →</button>`
                    : `<button class="pk-cta ghost" data-goto="colis">Voir le suivi →</button>`}
            </div>
        </div>
    </section>`;
}

// ── Missions ────────────────────────────────────────────────────────────
/* Chaque mission mène là où on l'accomplit. Une liste de choses à faire qui
   ne mène nulle part oblige à deviner dans quel onglet aller, et une étape
   qu'on doit chercher est une étape qu'on remet à plus tard. `champ` amène en
   plus le curseur sur le premier champ concerné. */
const MISSION_VERS = {
    profil:    {tab:'profil',   champ:'[data-p="tiktok"][data-k="username"]'},
    maillots:  {tab:'colis'},
    livraison: {tab:'profil',   champ:'[data-s="firstname"]'},
    unboxing:  {tab:'contenus'},
    video1:    {tab:'contenus'},
    video2:    {tab:'contenus'},
};

function missionRow(m){
    const vers = MISSION_VERS[m.id];
    const bal  = vers ? 'button' : 'div';
    const att  = vers ? ` type="button" data-mgo="${escAttr(m.id)}"` : '';
    return `<${bal} class="mission ${m.done?'done':''} ${vers?'go':''}"${att}>
        <div class="mission-check">${m.done?ICO.check:''}</div>
        <div class="mission-body">
            <div class="mission-label">${esc(m.label)}</div>
            <div class="mission-desc">${esc(m.desc)}</div>
        </div>
        <span class="mission-state ${m.done?'st-done':'st-todo'}">${m.done?'Fait':'À faire'}</span>
        ${vers ? `<svg class="mission-fl" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>` : ''}
    </${bal}>`;
}

/* Ouvre l'onglet, puis pose le curseur sur le champ visé. Le délai laisse
   `render()` reconstruire la vue : sans lui, on cherche un champ qui n'existe
   pas encore. */
function allerMission(id){
    const vers = MISSION_VERS[id];
    if(!vers) return;
    setTab(vers.tab);
    if(!vers.champ) return;
    setTimeout(()=>{
        const el = document.querySelector(vers.champ);
        if(!el) return;
        el.scrollIntoView({block:'center', behavior:'smooth'});
        el.focus({preventScroll:true});
    }, 90);
}

function bindMissions(){
    document.querySelectorAll('[data-mgo]').forEach(b=>{
        b.onclick = ()=> allerMission(b.getAttribute('data-mgo'));
    });
}

function viewMissions(){
    const done = D.missions.filter(m=>m.done).length;
    // Le guide d'abord, les missions ensuite. Elle ouvre cet onglet pour
    // publier, pas pour contempler une liste de cases : ce qu'elle vient
    // chercher doit être sous son pouce, pas trois écrans plus bas.
    return `${blockGuide()}
    <section class="sec">
        <div class="sec-k">Ton parcours</div>
        <div class="sec-t">Tes missions</div>
        <div class="sec-sub">${done} sur ${D.missions.length} accomplies.</div>
        <div style="margin-top:14px">${D.missions.map(missionRow).join('')}</div>
    </section>`;
}

   La description n'est écrite qu'UNE fois, en bas, parce qu'elle est la même
   pour les deux formats. La répéter dans chaque carte doublerait le texte et
   ferait douter qu'il s'agisse bien du même contenu à coller. */

// ── Colis ───────────────────────────────────────────────────────────────
function shipSteps(){
    const st = D.influencer.status || 0;
    const ts = (D.influencer.tracking_status||'').toLowerCase();
    // Étapes : commande → préparation → expédié → en transit → livré
    let reached = 0;
    if(st >= 3) reached = 1;                  // accord → commande
    if(st >= 4 || D.influencer.tracking) reached = 2;   // préparation/expédié
    if(D.influencer.tracking) reached = 3;
    if(ts === 'transit') reached = 4;
    if(ts === 'livre' || st >= 5) reached = 5;
    return [
        {label:'Commande enregistrée', i:1},
        {label:'En préparation',       i:2},
        {label:'Expédié',              i:3},
        {label:'En transit',           i:4},
        {label:'Livré',                i:5},
    ].map(s=>({...s, done: reached > s.i, current: reached === s.i}));
}

/* Les deux seules choses qu'elle sait avant nous : que le colis est arrivé,
   et qu'il y a un problème. Sans ces boutons, les deux partaient en message
   qu'il fallait lire, comprendre, puis reporter à la main dans la console. */
function colisActions(){
    const inf = D.influencer;
    if((inf.status || 0) < 5) return '';          // rien avant l'expédition
    if(inf.tracking_status === 'livre')
        return `<div class="ca-ok">${ICO.check} Réception confirmée. Merci !</div>`;
    if(inf.tracking_status === 'probleme')
        return `<div class="ca-ok warn">${ICO.warn} On a bien noté le souci, on revient vers toi.</div>`;
    return `<div class="ca">
        <div class="ca-q">Tu l'as reçu ?</div>

            <button class="btn" id="caRecu">Oui, je l'ai reçu</button>

}

async function signalerColis(action, btn){
    const b = btn; b.disabled = true;
    try{
        const r = await fetch(`/api/espace/${SLUG}/colis`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({action})
        });
        const d = await r.json();
        if(!d.success) throw new Error(d.error || '');
        D.influencer.tracking_status = d.tracking_status;
        if(action === 'recu') D.influencer.status = Math.max(D.influencer.status || 0, 6);
        toast(action === 'recu' ? 'Réception confirmée, merci !' : 'C\'est noté, on regarde ça');
        render();
    }catch(e){
        toast('Impossible pour le moment. Réessaie.', true);
        b.disabled = false;
    }
}

/* ── Avantages ─────────────────────────────────────────────────────────
   Un menu de niveaux, pas une notice. Le palier sélectionné s'ouvre sur sa
   propre couleur, du gris au noir ; on tape une pastille pour aller voir ce
   que donne le suivant, ou le dernier. Par défaut, c'est le sien qui s'ouvre. */
let PAL_SEL = null;

const SHIRT = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.5 2.6 12 4.7l3.5-2.1 5 2.6a1 1 0 0 1 .5.9v3.4a1 1 0 0 1-1 1h-2v9.6a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V10.5H4a1 1 0 0 1-1-1V6.1a1 1 0 0 1 .5-.9l5-2.6Z"/></svg>';

function palChoisir(i){ PAL_SEL = i; render(); }

/* Le bloc « ce que tu gardes » est replié par défaut : il répète des choses
   déjà lues, il n'a pas à occuper l'écran tant qu'on ne le demande pas. */
let PAL_HER = false;

/* Tout ce qui reste vrai en arrivant au palier i : les avantages des paliers
   du dessous dont la clé n'a PAS été reprise plus haut. Sans ce tri, monter
   d'un palier empilait « −20 % » à côté de « −15 % ». */
function palAcquis(paliers, i){
    const vus = new Set(((paliers[i] || {}).perks || []).map(a => a && a.cle));
    const out = [];
    // On descend du palier le plus proche vers le plus bas — c'est la version
    // la plus haute d'un avantage qui survit — mais on RÉTABLIT l'ordre de
    // lecture en remettant chaque étage devant, d'un bloc. Sans ça, la liste
    // se lisait à l'envers, en commençant par le dernier ajout.
    for(let k = i - 1; k >= 0; k--){
        const lot = [];
        for(const a of (paliers[k].perks || [])){
            if(!a || vus.has(a.cle)) continue;
            vus.add(a.cle);
            lot.push(a);
        }
        out.unshift(...lot);
    }
    return out;
}

/* Le serveur marque d'astérisques ce qui doit ressortir. On échappe d'abord,
   on met en gras ensuite — jamais l'inverse, sinon un pseudo malicieux
   passerait en HTML. */
function perkTexte(a){
    const brut = (a && typeof a === 'object') ? (a.t || '') : (a || '');
    return esc(String(brut)).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
/* La flèche « remplace » n'a de sens que sur la carte où le remplacement a
   lieu. Dans « ce que tu gardes », tout est simplement acquis : un « + ». */
function perkListe(items, acquis){
    return `<ul class="tc-add">${items.map(a =>
        `<li><span class="tc-marq">${(!acquis && a && a.remp) ? '\u2191' : '+'}</span>` +
        `<span>${perkTexte(a)}</span></li>`).join('')}</ul>`;
}

/* Montant exact : « 39,80 € », virgule française, sans décimale inutile.
   On n'abrège JAMAIS ici — fmt() transformerait 1800 en « 1.8K », ce qui
   convient à un compteur mais ruine une promesse de rémunération. */
function fmtEur(v){
    const n = Number(v)||0;
    return (Number.isInteger(n) ? fmtFull(n) : n.toFixed(2).replace('.', ',')) + ' €';
}
/* Entier avec séparateur de milliers insécable : 1 800, 4 200. */
function fmtFull(n){
    return String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F');
}

// ── Interactions ────────────────────────────────────────────────────────
function bindDynamic(){
    // Changement de page du classement. On ne re-rend que ce bloc : reconstruire
    // tout l'écran ferait rejouer les animations d'entrée et sauter la page.
    document.querySelectorAll('[data-lbp]').forEach(btn=>{
        btn.onclick = ()=>{
            const n = Number(btn.getAttribute('data-lbp'));
            if(!Number.isFinite(n) || n === LB_PAGE) return;
            LB_PAGE = n;
            const sec = btn.closest('section');
            const tmp = document.createElement('div');
            tmp.innerHTML = blockRank();
            const neuf = tmp.firstElementChild;
            if(neuf && sec){
                neuf.classList.remove('rise');
                neuf.style.animation = 'none';
                sec.replaceWith(neuf);
                bindDynamic();
                // Les barres du bloc reconstruit doivent être remplies elles
                // aussi : animate() ne tourne qu'au rendu complet de l'écran.
                requestAnimationFrame(()=>{
                    neuf.querySelectorAll('[data-fill]').forEach(el=>{
                        el.style.width = el.getAttribute('data-fill') + '%';
                    });
                });
            }
        };
    });

    document.querySelectorAll('[data-copy]').forEach(b=>{
        b.onclick = async ()=>{
            const ok = await copier(b.getAttribute('data-copy'));
            if(!ok){
                // Dans le navigateur intégré de TikTok ou Instagram, la copie
                // peut échouer sans rien dire. Afficher « Copié » là-dessus,
                // c'est laisser publier une description sans code promo.
                toast('Copie impossible ici — sélectionne le texte à la main', true);
                return;
            }
            // Retour visuel sur le bouton lui-même : plus direct qu'une notification.
            const lbl = b.querySelector('span'), ico = b.querySelector('svg');
            if(lbl && ico){
                b.classList.add('done');
                const t0 = lbl.textContent, i0 = ico.innerHTML;
                lbl.textContent = 'Copié';
                ico.innerHTML = '<path d="M20 6L9 17l-5-5"/>';
                setTimeout(()=>{ b.classList.remove('done'); lbl.textContent = t0; ico.innerHTML = i0; }, 1800);
            }else{
                toast('Code copié');
            }
        };
    });
    document.querySelectorAll('[data-goto]').forEach(b=>{
        b.onclick = ()=> setTab(b.getAttribute('data-goto'));
    });
    const add = document.getElementById('vAdd');
    if(add) add.onclick = addVideo;

    const recu = document.getElementById('caRecu');
    if(recu) recu.onclick = () => signalerColis('recu', recu);
    const pb = document.getElementById('caPb');
    if(pb) pb.onclick = () => signalerColis('probleme', pb);

    document.querySelectorAll('[data-vdel]').forEach(b=>{
        b.onclick = () => supprimerVideo(b.getAttribute('data-vdel'), b);
    });
}

/* Copier vraiment, et savoir si ça a marché.
   `navigator.clipboard` n'existe pas hors contexte sécurisé et peut échouer
   en silence dans les webviews des applis sociales — exactement là où le code
   promo se copie. On tente l'API, puis un repli, et on renvoie le verdict. */
async function copier(texte){
    try{
        if(navigator.clipboard && window.isSecureContext){
            await navigator.clipboard.writeText(texte);
            return true;
        }
    }catch(e){ /* on tente le repli */ }
    try{
        const z = document.createElement('textarea');
        z.value = texte;
        z.setAttribute('readonly', '');
        z.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(z);
        z.select(); z.setSelectionRange(0, texte.length);
        const ok = document.execCommand('copy');
        z.remove();
        return !!ok;
    }catch(e){ return false; }
}

async function supprimerVideo(id, btn){
    if(!confirm('Retirer cette vidéo de tes contenus ?')) return;
    btn.disabled = true;
    try{
        const r = await fetch(`/api/espace/${SLUG}/video/${id}`, {method:'DELETE'});
        const d = await r.json();
        if(!d.success) throw new Error(d.error || '');
        D.videos = (D.videos || []).filter(v => v.id !== id);
        toast('Vidéo retirée');
        render();
    }catch(e){
        toast("La suppression n'a pas fonctionné. Réessaie.", true);
        btn.disabled = false;
    }
}

    const type = document.getElementById('vType').value;
    const link = document.getElementById('vLink').value.trim();
    if(!link){ toast('Ajoute le lien de ta vidéo'); return; }
    try{
        const r = await fetch(`/api/espace/${SLUG}/video`,{
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({type, link})
        });
        const d = await r.json();
        if(d.success){ toast('Vidéo ajoutée'); await load(); setTab('contenus'); }
        else toast(messageClair(d.error), true);
    }catch(e){ toast('Erreur réseau'); }
}

/* Sans historique, le geste réflexe sur téléphone — le bouton « retour » —
   faisait sortir complètement de l'espace au lieu de revenir à l'onglet
   précédent, et un rafraîchissement ramenait toujours à l'accueil. */
const ONGLETS = ['home','missions','colis','paliers','contenus','profil'];

function setTab(t, sansHistorique){
    if(t !== TAB){ PAL_SEL = null; PAL_HER = false; }
    if(!sansHistorique && t !== TAB){
        try{ history.pushState({tab:t}, '', '#' + t); }catch(e){}
    }
    TAB = t;
    document.querySelectorAll('[data-tab]').forEach(b=>{
        b.classList.toggle('active', b.getAttribute('data-tab')===t);
    });
    render();
    window.scrollTo({top:0, behavior:'smooth'});
}
document.querySelectorAll('[data-tab]').forEach(b=>{
    b.addEventListener('click', ()=> setTab(b.getAttribute('data-tab')));
});

window.addEventListener('popstate', e=>{
    const t = (e.state && e.state.tab) || (location.hash || '').slice(1) || 'home';
    if(ONGLETS.includes(t)) setTab(t, true);
});

/* Au chargement, on rouvre l'onglet de l'adresse : un rafraîchissement garde
   sa place, et tu peux envoyer un lien direct vers « Mes informations ». */
function ongletDepuisAdresse(){
    const t = (location.hash || '').slice(1);
    return ONGLETS.includes(t) ? t : null;
}

let toastT=null;
/* Le serveur parle en noms de champs. Elle, non. On traduit ce qu'elle peut
   voir, et tout le reste devient une phrase qui ne l'accuse de rien. */
const MSG_SERVEUR = {
    'type ou lien invalide': "Ce lien ne semble pas valide — colle l'adresse complète de ta vidéo.",
    'aucun champ modifiable': "Il n'y a rien de nouveau à enregistrer.",
    'introuvable': "On n'a pas retrouvé ton espace. Écris-nous, on regarde.",
    'code requis': "Il faut ton code à 4 chiffres pour changer ton adresse.",
};
function messageClair(brut){
    const t = String(brut || '').trim();
    if(MSG_SERVEUR[t]) return MSG_SERVEUR[t];
    // Une phrase écrite pour elle commence par une majuscule et finit par un
    // point. Tout le reste est du jargon serveur, qu'on ne montre pas.
    return /^[A-ZÀ-Ý].*[.!?]$/.test(t) ? t
        : "Ça n'a pas pu s'enregistrer. Réessaie dans un instant.";
}

/* Le second paramètre était passé à trois endroits et purement ignoré :
   « Copie impossible ici » s'affichait dans la même pastille bleu marine que
   « Vidéo ajoutée », et disparaissait en 2,2 s. Elle croyait avoir copié son
   code promo, publiait sans, et la vente n'était jamais attribuée. */
function toast(msg, erreur){
    const el=document.getElementById('toast');
    el.textContent=msg;
    el.classList.toggle('err', !!erreur);
    el.classList.add('show');
    clearTimeout(toastT);
    toastT=setTimeout(()=>el.classList.remove('show'), erreur ? 4200 : 2200);
}

// ── Vue : Mon profil ────────────────────────────────────────────────────

         message le plus fréquent : « j'ai perdu le lien ». Le code de

         quelqu'un qui détient déjà le lien, l'afficher le viderait de son sens.

         Présenté comme « Ton lien et ton code » sur l'accueil, avec les mêmes
         classes : c'est le même geste — lire une valeur, la copier. Une carte
         inventée pour l'occasion, en aplat bleu, faisait deux fautes à la

    <div class="card">

function renderJerseyGrid(){
    const el = document.getElementById('jerseyGrid');
    if(!el) return;
    const list = (CATALOG && CATALOG.jerseys) || [];
    if(!list.length){
        el.innerHTML = `<div class="empty" style="padding:24px 10px">
            <div class="empty-ico">${ICO.tag}</div>
            <div class="empty-title">Catalogue en cours de mise à jour</div>
            <div class="empty-text">Les maillots disponibles arrivent très vite. Reviens dans un moment.</div>
        </div>`;
        return;
    }
    el.innerHTML = `<div class="jgrid">${list.map(j=>{
        const pick = PICKS.find(p=>p.id===j.id);
        return `<div class="jcard ${pick?'sel':''}">
            <div class="jcard-tick">${ICO.check}</div>
            <img class="jcard-img" src="${escAttr(j.image)}" alt="${escAttr(j.name)}" loading="lazy">
            <div class="jcard-body">
                <div class="jcard-name">${esc(j.name)}</div>
                ${j.sub?`<div class="jcard-sub">${esc(j.sub)}</div>`:''}
                <div class="jsizes">
                    ${Object.entries(j.sizes).map(([s,q])=>
                        `<div class="jsize ${pick&&pick.size===s?'on':''} ${q>0?'':'out'}" data-size="${s}" data-jid="${escAttr(j.id)}">${s}</div>`
                    ).join('')}
                </div>
            </div>
        </div>`;
    }).join('')}</div>`;

    el.querySelectorAll('[data-size]').forEach(b=>{

            e.stopPropagation();
            if(b.classList.contains('out')) return;
            selectJersey(b.getAttribute('data-jid'), b.getAttribute('data-size'));
        };
    });
    renderPicked();
}

function selectJersey(jid, size){
    const j = CATALOG.jerseys.find(x=>x.id===jid);
    if(!j) return;
    const existing = PICKS.findIndex(p=>p.id===jid);
    if(existing >= 0){
        if(PICKS[existing].size === size) PICKS.splice(existing,1);
        else PICKS[existing].size = size;
    }else{
        if(PICKS.length >= 2){ toast('Tu as déjà choisi 2 maillots'); return; }
        // `image` sert à l'aperçu ici et maintenant ; c'est `r2_key` qui part
        // au serveur, parce qu'une URL signée expire au bout de 7 jours.
        PICKS.push({id:j.id, name:j.name, sub:j.sub, size,
                    image:j.image, r2_key:j.r2_key || ''});
    }
    const c = document.getElementById('pickCount');
    if(c){ c.textContent = `${PICKS.length} / 2`; c.classList.toggle('full', PICKS.length>=2); }
    renderJerseyGrid();
}

function renderPicked(){
    const z = document.getElementById('pickedZone');
    if(!z) return;
    if(!PICKS.length){ z.innerHTML=''; return; }
    const locked = !!D.influencer.jerseys_locked;
    z.innerHTML = `<div class="picked${locked ? ' locked' : ''}">${PICKS.map((p,i)=>`
        <div class="picked-item">
            <img class="picked-img" src="${escAttr(p.image||'')}" alt="">
            <div><div class="picked-name">${esc(p.name)}</div><div class="picked-size">Taille ${esc(p.size)}</div></div>
            ${locked ? '' : `<span class="picked-rm" data-rm="${i}">✕</span>`}
        </div>`).join('')}</div>`;
    z.querySelectorAll('[data-rm]').forEach(b=>{
        b.onclick = ()=>{
            PICKS.splice(+b.getAttribute('data-rm'),1);
            renderJerseyGrid();
            const c=document.getElementById('pickCount');
            if(c){c.textContent=`${PICKS.length} / 2`;c.classList.toggle('full',PICKS.length>=2);}
        };
    });
}

async function saveProfil(){
    const btn = document.getElementById('profilSave');
    btn.disabled = true; btn.textContent = 'Enregistrement…';

    // On repart de ce qui est déjà enregistré, puis on écrase seulement les
    // réseaux affichés. Reconstruire à partir des seuls champs visibles
    // effacerait X, Facebook, Pinterest et Threads au premier enregistrement.
    const platforms = {};
    const dejaLa = D.influencer.platforms || {};
    const affiches = new Set(PLATFORMS.map(pl => pl.key));
    Object.keys(dejaLa).forEach(k=>{
        if(!affiches.has(k)) platforms[k] = dejaLa[k];
    });
    document.querySelectorAll('[data-p]').forEach(inp=>{
        const p = inp.getAttribute('data-p'), k = inp.getAttribute('data-k');
        platforms[p] = platforms[p] || {};
        const v = inp.value.trim();
        if(v) platforms[p][k] = (k==='username') ? v : (parseInt(v)||0);
    });
    Object.keys(platforms).forEach(k=>{
        if(affiches.has(k) && !Object.keys(platforms[k]).length) delete platforms[k];
    });

    const shipping = {};
    document.querySelectorAll('[data-s]').forEach(inp=>{
        const v = inp.value.trim();
        if(v) shipping[inp.getAttribute('data-s')] = v;
    });

    // L'adresse ne part que si elle a bougé. Elle était renvoyée à chaque
    // enregistrement, si bien que corriger un pseudo Instagram réclamait le
    // code à 4 chiffres — et sans parcours « code oublié », c'était un
    // message à traiter.
    const avant = D.influencer.shipping || {};
    // La liste comparée DOIT être celle du formulaire. Elle contenait `name`,
    // `extra` et `note` — trois champs qui n'existent pas — et oubliait
    // `firstname`, `lastname` et `email` : corriger son prénom ne partait
    // jamais au serveur. L'écran annonçait « enregistré », puis la valeur
    // revenait à l'ancienne au rechargement, et le colis partait au mauvais nom.
    const CHAMPS_ADRESSE = ['firstname','lastname','address','postal',
                            'city','country','phone','email'];
    const memeAdresse = CHAMPS_ADRESSE
        .every(k => (shipping[k] || '') === (avant[k] || ''));

    // Les maillots ne se choisissent plus depuis l'espace : on n'envoie que
    // ce que cet écran contient encore.
    const corps = {platforms};
    if(!memeAdresse) corps.shipping = shipping;

    try{
        const r = await fetch(`/api/espace/${SLUG}/update`,{
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify(corps)
        });
        let d = await r.json();

        // L'adresse de livraison est protégée par un code : si le serveur le
        // réclame, on le demande puis on rejoue l'enregistrement tel quel.
        // L'influenceur ne perd pas sa saisie.
        if(r.status === 403 && d.pin_required){
            const ok = await askPin();
            if(!ok){
                btn.disabled=false; btn.textContent='Enregistrer mes informations';
                return;
            }
            const r2 = await fetch(`/api/espace/${SLUG}/update`,{
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify(corps)
            });
            d = await r2.json();
        }

        if(d.success){ toast('Informations enregistrées ✓'); await load(); setTab('profil'); }
        else toast(messageClair(d.error), true);
    }catch(e){ toast('Erreur réseau'); }
    finally{ btn.disabled=false; btn.textContent='Enregistrer mes informations'; }
}

// ── Code d'accès ────────────────────────────────────────────────────────
// Demandé uniquement pour écrire l'adresse de livraison. La consultation de
// l'espace reste libre : ajouter une porte à l'entrée ferait fuir, alors que
// le risque réel se limite au détournement du colis.
function askPin(){
    return new Promise(resolve=>{
        const wrap = document.createElement('div');
        wrap.className = 'pin-back';
        wrap.innerHTML = `
            <div class="pin-box" role="dialog" aria-modal="true" aria-label="Code d'accès">
                <div class="pin-t">Confirme ton code</div>
                <div class="pin-d">Pour modifier ton adresse de livraison, saisis le code à 4 chiffres transmis par l'équipe Volakits.</div>
                <input class="pin-in num" id="pinIn" inputmode="numeric" autocomplete="one-time-code"
                       maxlength="4" placeholder="0000" aria-label="Code à 4 chiffres">
                <div class="pin-err" id="pinErr"></div>
                <div class="pin-acts">
                    <button class="pin-ghost" id="pinCancel">Annuler</button>
                    <button class="btn" id="pinOk">Confirmer</button>
                </div>
            </div>`;
        document.body.appendChild(wrap);

        const input  = wrap.querySelector('#pinIn');
        const errEl  = wrap.querySelector('#pinErr');
        const okBtn  = wrap.querySelector('#pinOk');
        setTimeout(()=>input.focus(), 40);

        const close = v => { wrap.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
        const onKey = e => { if(e.key === 'Escape') close(false); };
        document.addEventListener('keydown', onKey);

        input.addEventListener('input', ()=>{
            input.value = input.value.replace(/\D/g,'').slice(0,4);
            errEl.textContent = '';
        });
        input.addEventListener('keydown', e=>{ if(e.key === 'Enter') okBtn.click(); });
        wrap.querySelector('#pinCancel').addEventListener('click', ()=> close(false));
        wrap.addEventListener('click', e=>{ if(e.target === wrap) close(false); });

        okBtn.addEventListener('click', async ()=>{
            const pin = input.value.trim();
            if(pin.length !== 4){ errEl.textContent = 'Le code fait 4 chiffres.'; return; }
            okBtn.disabled = true; okBtn.textContent = 'Vérification…';
            try{
                const r = await fetch(`/api/espace/${SLUG}/verify`,{
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({pin})
                });
                const d = await r.json();
                if(d.success) return close(true);
                errEl.textContent = d.error || 'Code incorrect.';
                if(d.locked) return setTimeout(()=> close(false), 1600);
                input.value = ''; input.focus();
            }catch(e){ errEl.textContent = 'Erreur réseau.'; }
            finally{ okBtn.disabled = false; okBtn.textContent = 'Confirmer'; }
        });
    });
}

/* « Quand suis-je payée ? » n'avait aucune réponse dans l'espace alors que la
   date de clôture est calculée à chaque affichage. */
function quandPayee(){
    const c = D.month_clock || {};
    if(!c.end) return '';
    const fin = new Date(c.end + 'T12:00:00');
    if(isNaN(fin)) return '';
    const jour = fin.toLocaleDateString('fr-FR', {day:'numeric', month:'long'});
    const reste = c.days_left;
    return `Ta période se termine le <b>${jour}</b>`
         + (reste === 0 ? " — c'est aujourd'hui."
            : reste === 1 ? ' — demain.'
            : ` — dans ${reste} jours.`)
         + ' Ton virement part dans les jours qui suivent.';
}

// Un « écris-nous » qui n'est pas cliquable est une impasse de plus.
function lienAide(texte){
    const u = (D.contact && D.contact.url) || '';
    return u ? `<a href="${escAttr(u)}" target="_blank" rel="noopener" class="lien">${esc(texte)}</a>`
             : esc(texte);
}

// ── Utils ───────────────────────────────────────────────────────────────
// Les euros ne s'abrègent pas : « 1.2K € » n'est pas un montant.
function eur(v){
    return (Math.round((Number(v)||0)*100)/100)
        .toLocaleString('fr-FR', {style:'currency', currency:'EUR',
                                  minimumFractionDigits:0, maximumFractionDigits:0});
}
function fmt(n){
    n = Number(n)||0;
    if(n >= 1000000) return (n/1000000).toFixed(1).replace('.0','')+'M';
    if(n >= 1000)    return (n/1000).toFixed(1).replace('.0','')+'K';
    return String(n);
}
function fmtDate(iso){
    const d=new Date(iso);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'2-digit'});
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

load();
</script>
