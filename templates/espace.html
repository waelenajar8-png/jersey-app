<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon espace — Volakits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   VOLAKITS — Design System
   ──────────────────────────────────────────────────────────────────────────
   LA RÈGLE : un seul aplat fort par écran.
   Le bleu de marque ne porte qu'UNE grande surface à la fois — le pavé de
   gains sur l'accueil, le palier courant sur les paliers, le bouton
   d'action sur le profil. Partout ailleurs il se limite aux petits signaux.
   Certains écrans n'ont aucun aplat : c'est volontaire, ça donne du repos.
   Multiplier les surfaces fortes ne renforce pas la couleur, ça la dilue —
   c'est ce qui rendait les versions précédentes agressives.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
    /* Surfaces — crème neutre, jamais bleuté : un fond légèrement bleu fait
       basculer l'ensemble du côté « tableau de bord ». */
    --bg:#F4F4F1;
    --surface:#FFFFFF;
    --surface-2:#FAFAF8;
    /* Navigation : bleu très sombre, de la famille de la marque. Plus jamais
       de noir — un noir neutre concurrence l'aplat bleu au lieu de le porter. */
    --sidebar:#141D52;
    --sidebar-2:#1B2664;

    /* Texte */
    --ink:#101322;
    --ink-2:#3B3E4C;
    --muted:#63655C;
    --faint:#6B6D64;
    --on-dark:#E8ECFA;
    --on-dark-dim:#7182BC;

    /* Accent */
    /* #2F50F1 : couleur signature Volakits, en aplat PLEIN (aucun dégradé —
       un dégradé date, et il brouille la frontière de la surface). */
    --accent:#2F50F1;
    --accent-2:#2846DC;
    --accent-soft:#E7EBFE;
    --accent-ring:rgba(47,80,241,.16);
    --accent-grad:#2F50F1;
    /* Texte posé SUR l'aplat bleu */
    --on-accent:#C7D3FF;
    --on-accent-dim:#A8B8FF;
    --on-accent-lab:#B9C6FF;

    /* Statuts — désaturés pour ne pas rivaliser avec le bleu de marque */
    --ok:#1F8A5B;      --ok-soft:#E4F3EC;
    --warn:#B87A18;    --warn-soft:#FBF1DF;
    --info:#2F50F1;    --info-soft:#E7EBFE;
    --danger:#C0392B;  --danger-soft:#FBEBE9;
    --gold:#B08A1E;    --gold-soft:#F8F1DF;

    /* Traits */
    --line:#E2E1DA;
    --line-2:#DEDDD5;

    /* Ombres */
    /* Plus aucune ombre : la hiérarchie vient de l'espace et de la
       typographie. Les variables restent pour ne rien casser ailleurs. */
    --sh-xs:none; --sh-sm:none; --sh-md:none; --sh-lg:none; --sh-accent:none;

    /* Rayons */
    --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:var(--accent);color:#fff}
html{-webkit-text-size-adjust:100%}
body{
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    letter-spacing:-.011em;line-height:1.5;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit}
/* ── Layout ─────────────────────────────────────────────────────────────── */
.shell{display:flex;min-height:100vh}
/* ── Sidebar (sombre) ───────────────────────────────────────────────────── */
.side{
    width:250px;flex-shrink:0;background:var(--sidebar);color:var(--on-dark);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    padding:22px 14px;
}
.side-brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;margin-bottom:6px}
.brand-mark{
    width:34px;height:34px;border-radius:9px;background:var(--accent-grad);
    display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;
    flex-shrink:0;
}
.brand-name{font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.brand-sub{font-size:10.5px;color:var(--on-dark-dim);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.side-user{background:none!important;padding-left:8px!important;padding-right:8px!important;
    display:flex;align-items:center;gap:11px;padding:11px;margin-bottom:18px;
    background:var(--sidebar-2);border-radius:var(--r);
}
.side-avatar{
    width:36px;height:36px;border-radius:10px;background:var(--accent-grad);
    display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0;
}
.side-user-info{min-width:0;flex:1}
.side-user-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user-tier{font-size:11px;color:var(--on-dark-dim);font-weight:600;display:flex;align-items:center;gap:4px}
.nav-group{margin-bottom:16px}
.nav-label{
    font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--on-dark-dim);padding:0 10px 7px;
}
.nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;
    font-size:13.5px;font-weight:600;color:var(--on-dark-dim);
    transition:background .16s,color .16s;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--on-dark)}
.nav-item.active{background:rgba(255,255,255,.09);color:#fff;box-shadow:none}
.nav-item.active .nav-ico{color:#7E97FF}
.nav-ico{width:17px;height:17px;flex-shrink:0;stroke-width:1.9}
.nav-badge{
    margin-left:auto;background:rgba(255,255,255,.14);font-size:10.5px;font-weight:800;
    padding:1px 7px;border-radius:20px;
}
.nav-item.active .nav-badge{background:rgba(255,255,255,.25)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.07)}
.side-help{font-size:11.5px;color:var(--on-dark-dim);line-height:1.6}
.side-help a{color:#7E97FF;font-weight:600}
/* ── Contenu ────────────────────────────────────────────────────────────── */
.main{flex:1;min-width:0;padding:44px 40px 90px}
.wrap{max-width:860px;margin:0 auto}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.hello h1{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.hello p{color:var(--muted);font-size:14px;font-weight:500;margin-top:5px}
.tier-pill .dot{width:8px;height:8px;border-radius:50%}
/* ── Cartes ─────────────────────────────────────────────────────────────── */
/* Une « carte » n'est plus qu'une section : l'espace la délimite, pas un cadre. */
.card{background:none;border:none;border-radius:0;box-shadow:none;padding:0}
.card + .card{margin-top:40px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.card-title{font-size:17px;font-weight:700;letter-spacing:-.025em;display:flex;align-items:center;gap:9px}
/* L'icône n'a plus de carré coloré derrière elle. */
.card-title .ico-box{width:auto;height:auto;background:none;color:var(--faint);display:none}
.card-sub{font-size:12.5px;color:var(--muted);font-weight:500}
/* ── Grilles ────────────────────────────────────────────────────────────── */
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:1fr 1fr}
/* ══ Accueil ═══════════════════════════════════════════════════════════════
   Une seule surface de marque porte les gains. Le reste est blanc, structuré
   par la typographie et l'espace. Rien n'est affiché sans donnée réelle.
   ═════════════════════════════════════════════════════════════════════════ */

/* — Carte des gains — */
/* ── L'APLAT FORT ─────────────────────────────────────────────────────────
   C'est la seule grande surface colorée de l'accueil. Aplat plein, sans
   dégradé ni halo : la frontière de la surface doit être franche, sinon la
   couleur paraît sale. Tout le reste de la page reste en retrait pour ne
   pas lui disputer la place. */
.gains{position:relative;overflow:hidden;color:#fff;border-radius:24px;
    padding:30px 28px 26px;background:var(--accent)}
.gains > *{position:relative;z-index:1}
.gains-k{font-size:10.5px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;
    color:var(--on-accent-lab)}
.gains-v{font-size:62px;font-weight:700;letter-spacing:-.052em;line-height:.94;margin-top:15px}
.gains-sub{font-size:13px;color:var(--on-accent);font-weight:500;margin-top:12px}
.gains-sep{height:1px;background:rgba(255,255,255,.2);margin:24px 0 0}
/* Les faits passent en petites capitales espacées : ils informent sans
   rivaliser avec le montant, qui reste seul à être lu de loin. */
.gains-facts{display:flex;align-items:center;margin-top:18px;font-size:9.5px;
    font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--on-accent-dim);flex-wrap:wrap;row-gap:8px}
.gains-facts > .num{padding-right:13px;margin-right:13px;
    border-right:1px solid rgba(255,255,255,.24)}
.gains-facts > .num:last-child{border-right:none;padding-right:0;margin-right:0}
.gains-facts .d{display:none}
/* — Objectif : la récompense d'abord, le décompte ensuite — */
.goal{background:var(--surface);border:none;border-radius:18px;padding:24px;margin-top:14px}
.goal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.goal-k{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.goal-left{font-size:26px;font-weight:700;letter-spacing:-.04em;margin-top:12px;line-height:1.1}
.goal-for{font-size:13.5px;color:var(--muted);font-weight:500;margin-top:5px}
.rewards{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.rw{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;
    background:var(--accent-soft);color:var(--accent);border-radius:100px;padding:8px 14px;
    opacity:0;transform:translateY(6px);animation:rise .45s ease forwards}
.rw svg{width:13px;height:13px;stroke-width:2.2;opacity:.75}
.goal-bar{height:6px;background:#EDECE5;border-radius:100px;overflow:hidden;margin-top:20px}
.goal-fill{height:100%;border-radius:100px;background:var(--accent);width:0;transition:width 1.2s ease}
.goal-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;
    margin-top:11px;flex-wrap:wrap}
.goal-cnt{font-size:12.5px;color:var(--faint);font-weight:600}
.goal-cta{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;
    color:var(--accent);transition:gap .18s ease;cursor:pointer}
.goal-cta:hover{gap:9px}
.goal-cta svg{width:14px;height:14px;stroke-width:2.2}
.goal-done{font-size:13.5px;font-weight:600;color:var(--ok);margin-top:14px}
/* Fin de période : l'urgence passe par la couleur du trait et une ligne de
   date, pas par un bandeau ni un badge. Le bloc garde exactement sa forme.
   Une règle repeignait pourtant tout le fond en beige — elle contredisait
   cette intention écrite juste au-dessus, et surtout elle sortait le bloc de
   la palette : une grande surface chaude au milieu d'un écran crème et bleu
   ne se lit pas comme une alerte, seulement comme une faute de couleur.
   L'urgence tient sur deux signaux, la ligne de compte à rebours et la barre
   de progression, tous deux dans l'ambre de la marque. */
.goal-dl{display:inline-flex;align-items:center;gap:7px;margin-top:12px;
    font-size:12.5px;font-weight:700;color:var(--warn);letter-spacing:-.01em}
.goal-dl::before{content:"";width:6px;height:6px;border-radius:100px;background:var(--warn)}
.goal.urgent .goal-fill{background:var(--warn)}
/* Classement : même graisse que les autres faits, jamais mis en avant —
   sauf sur le podium, réellement tenu, où l'accent de marque le signale. */
/* Sur l'aplat bleu, le podium se signale en blanc plein — l'accent de
   marque y serait invisible. */
/* — Code d'accès — */
.pin-back{position:fixed;inset:0;z-index:200;background:rgba(11,16,32,.42);
    display:grid;place-items:center;padding:20px;animation:pinIn .18s ease}
.pin-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
    padding:28px;width:100%;max-width:380px}
.pin-t{font-size:19px;font-weight:700;letter-spacing:-.03em}
.pin-d{font-size:13.5px;color:var(--muted);font-weight:500;margin-top:7px;line-height:1.55}
.pin-in{width:100%;margin-top:20px;padding:14px 16px;border:1px solid var(--line-2);
    border-radius:var(--r);font-size:26px;font-weight:700;text-align:center;
    letter-spacing:.42em;text-indent:.42em;background:var(--surface-2);color:var(--ink);
    outline:none;transition:border-color .16s ease}
.pin-in:focus{border-color:var(--accent);background:var(--surface)}
.pin-err{min-height:18px;margin-top:9px;font-size:12.5px;font-weight:600;color:var(--danger)}
.pin-acts{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:10px}
.pin-ghost{font-size:13.5px;font-weight:600;color:var(--muted);padding:10px 14px;border-radius:100px}
.pin-ghost:hover{color:var(--ink)}
@keyframes pinIn{from{opacity:0}to{opacity:1}}
/* Rail des paliers : la position rendue tangible, sans donnée nouvelle. */
.rail{display:flex;align-items:center;gap:5px;flex-shrink:0}
.rail-s{width:16px;height:4px;border-radius:100px;background:#E5E4DC}
.rail-s.done{background:var(--accent)}
.rail-s.now{background:var(--accent);width:24px;box-shadow:0 0 0 3px var(--accent-ring)}
.rail-l{font-size:11px;font-weight:700;color:var(--faint);margin-left:3px}
/* — Sections —
   L'écart ne se déclenchait qu'entre deux .sec, alors que l'accueil alterne
   .gains, .goal et .sec : le libellé d'une section se retrouvait donc collé
   au bloc blanc précédent. On cible tous les voisinages, et on passe l'écart
   à 52 px — un libellé annonce un nouveau sujet, il lui faut plus d'air
   qu'à deux paragraphes voisins. */
.sec + .sec,
.gains + .sec, .goal + .sec, .promo + .sec,
.card + .sec,
.sec + .gains, .sec + .goal{margin-top:52px}
.gains + .goal{margin-top:16px}
.sec-k{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);margin-bottom:5px}
.sec-t{font-size:18px;font-weight:700;letter-spacing:-.03em}
/* Le titre de section respire avant ses éléments. */
.sec-t + div{margin-top:14px!important}
/* — Contenu de l'envoi : l'influenceur doit VOIR ce qu'il va recevoir —
   Un nom de maillot ne fait rien ressentir ; sa photo, si. C'est aussi ce
   qui permet de repérer une erreur de sélection avant que le colis parte. */
.ship-jerseys{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sj{background:var(--surface);border-radius:16px;overflow:hidden}
.sj-img{aspect-ratio:1/1;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.sj-img img{width:100%;height:100%;object-fit:cover;display:block}
.sj-ph{color:var(--faint);opacity:.55}
.sj-ph svg{width:26px;height:26px}
.sj-b{padding:13px 14px 15px}
.sj-n{font-size:13.5px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.sj-s{font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
@media (max-width:420px){.ship-jerseys{grid-template-columns:1fr}
    .sj{display:flex;align-items:center;gap:14px}
    .sj-img{width:78px;aspect-ratio:1/1;flex-shrink:0}
    .sj-b{padding:0 14px 0 0}}
/* — Sélection verrouillée par l'équipe — */
.lock-note{display:flex;gap:11px;align-items:flex-start;background:var(--warn-soft);
    border-radius:14px;padding:14px 16px;margin-bottom:16px}
.lock-note svg{width:15px;height:15px;stroke-width:2.2;color:var(--warn);flex-shrink:0;margin-top:2px}
.lock-note-t{font-size:13px;font-weight:700;color:var(--warn);letter-spacing:-.01em}
.lock-note-d{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.55}
.picked.locked .picked-rm{display:none}
.picked.locked .picked-item{opacity:.9}
/* ══ AVANTAGES ═══════════════════════════════════════════════════════════
   Écran qui doit donner envie de produire. Le seul aplat fort y est le
   palier — le statut acquis à vie, ce qui flatte. Les seuils du mois et la
   valeur de la prochaine vente restent sur surface claire : ils informent
   fort sans crier. */
/* ══ AVANTAGES ════════════════════════════════════════════════════════════
   Deux échelles cohabitent sur cet écran, et elles portent les MÊMES nombres
   — 10, 30, 60 — pour deux choses différentes : les ventes cumulées font
   monter de palier (maillots et avantages, acquis à vie), les ventes de la
   période déclenchent les montants garantis (euros, remis à zéro).
   Confondre les deux était la principale source d'incompréhension. On les
   sépare donc visuellement : un CHEMIN vertical pour les paliers, une
   ÉCHELLE horizontale pour la paie. Rien n'est replié : ce qu'on ne voit pas
   ne fait pas rêver. */
/* Le repère, pas la vitrine : il dit où elle en est en deux chiffres et une
   barre. La vitrine, c'est la carte du palier plus bas. */
.rw-hero{background:var(--surface);border:1px solid var(--line);
    border-radius:20px;padding:20px 22px 22px}
.rw-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.rw-hero-k{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
    font-weight:800;color:var(--faint)}
.rw-hero-v{font-size:23px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-top:7px}
.rw-hero-c{text-align:right;flex:none;display:flex;align-items:baseline;gap:5px}
.rw-hero-cn{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--accent)}
.rw-hero-ct{font-size:11.5px;font-weight:700;color:var(--muted)}
.rw-hero-max{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:8px}
.rw-hero-bar{height:8px;background:var(--surface-2);border-radius:100px;
    margin-top:16px;overflow:hidden}
.rw-hero-bar i{display:block;height:100%;background:var(--accent);border-radius:100px;
    transition:width .7s cubic-bezier(.2,.8,.2,1)}
.rw-hero-s{font-size:13px;color:var(--muted);margin-top:11px;line-height:1.5;font-weight:500}
.rw-hero-s b{color:var(--ink);font-weight:800}
.rw-hero + .sec{margin-top:40px}
/* ══ LIEN DE BIO ═════════════════════════════════════════════════════════
   Le code promo suppose que le visiteur le retienne puis le retape au bon
   moment. Le lien supprime les deux étapes : la réduction est déjà là. Il
   mérite donc autant de place que le code, et une explication — parce que
   « mets ce lien en bio » n'est évident que pour qui sait déjà pourquoi. */
.bio{background:var(--surface);border-radius:18px;padding:22px;margin-top:14px}
/* En attente d'activation : ton, pas alerte. Ce n'est pas une erreur de
   l'influenceuse, juste une etape qui n'est pas encore franchie. */
.bio.bio-wait{background:var(--surface-2);border:1px dashed var(--line-2)}
@media (max-width:520px){
    .bio{padding:18px}
}
/* ══ COLIS, SUR L'ACCUEIL ════════════════════════════════════════════════
   L'ancien bloc posait une phrase en chasse fixe sur le fond, sans surface
   ni progression : impossible de savoir où on en est ni quoi faire. On donne
   une carte, une barre segmentée qui montre les cinq étapes, et surtout une
   action nommée — quand l'influenceur peut débloquer lui-même, on le lui dit
   plutôt que de le renvoyer vers un « suivi » qui ne l'avance pas. */
.pk{background:var(--surface);border-radius:18px;padding:20px 22px;margin-top:12px}
.pk-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.pk-msg{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-.02em;line-height:1.45}
.pk-step{font-size:13px;font-weight:800;letter-spacing:-.02em;flex-shrink:0;color:var(--ink)}
.pk-step span{color:var(--faint);font-weight:600}
.pk-track{display:flex;gap:4px;margin-top:16px}
.pk-seg{flex:1;height:5px;border-radius:100px;background:#EDECE5;transition:background .3s ease}
.pk-seg.done{background:var(--accent)}
.pk-seg.now{background:var(--accent);opacity:.45}
.pk-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;
    margin-top:12px;flex-wrap:wrap}
.pk-now{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted)}
.pk-cta{font-size:13px;font-weight:700;color:var(--accent);background:none;border:none;
    padding:0;cursor:pointer;letter-spacing:-.01em;transition:opacity .16s ease}
.pk-cta:hover{opacity:.7}
.pk-cta.ghost{color:var(--muted);font-weight:600}
@media (max-width:520px){
    .pk{padding:18px}
    .pk-top{flex-direction:column;gap:8px}
    .pk-step{align-self:flex-start}
}

/* ══ PARTAGE ═════════════════════════════════════════════════════════════
   Un seul bloc pour le lien et le code. Deux cartes distinctes les faisaient
   se concurrencer, doublaient le texte et donnaient cette impression de
   remplissage. Le lien est en tête parce que c'est lui qui travaille sans
   effort ; le code suit, plus petit, sur une ligne. */
.shr{background:var(--surface);border-radius:18px;overflow:hidden;margin-top:12px}
.shr-main{padding:22px 22px 20px}
.shr-k{font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.shr-row{display:flex;align-items:center;gap:14px;margin-top:12px}
.shr-url{flex:1;min-width:0;font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:15px;font-weight:500;color:var(--ink);letter-spacing:-.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    border-bottom:1px solid transparent;transition:border-color .16s ease}
.shr-url:hover{border-bottom-color:var(--line-2)}
.shr-why{font-size:12.5px;color:var(--muted);margin-top:12px;font-weight:500;line-height:1.55}
.shr-soon{flex:1;font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:-.02em}
.shr-wait .shr-k{color:var(--muted)}
/* Le code, en pied de bloc : présent, jamais dominant. */
.shr-code{display:flex;align-items:center;gap:12px;padding:15px 22px;
    border-top:1px solid var(--line);background:var(--surface-2)}
.shr-code-k{font-size:9px;letter-spacing:.18em;text-transform:uppercase;
    font-weight:700;color:var(--faint);flex-shrink:0}
.shr-code-v{flex:1;min-width:0;font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:15px;font-weight:700;letter-spacing:.05em;
    overflow:hidden;text-overflow:ellipsis}
.copy-btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2);
    padding:7px 13px;font-size:12.5px}
.copy-btn.ghost:hover{border-color:var(--ink-2)}
@media (max-width:520px){
    .shr-main{padding:18px}
    .shr-row{flex-direction:column;align-items:stretch;gap:11px}
    .shr-url{white-space:normal;word-break:break-all;font-size:14px;text-align:center}
    .shr-row .copy-btn{justify-content:center}
    .shr-code{padding:14px 18px;flex-wrap:wrap;row-gap:8px}
    .shr-code-v{flex:1 1 auto;font-size:14px}
}
/* ══ RÉMUNÉRATION UNIVERSELLE ════════════════════════════════════════════
   Elle passe avant les paliers, parce qu'elle ne dépend pas d'eux : les
   montants garantis sont ouverts à tout le monde dès le premier mois. Les
   placer dans la fiche de chaque palier laissait croire le contraire et
   sous-vendait le programme auprès des débutants. */
/* ── Paliers ──────────────────────────────────────────────────────────────
   Un sélecteur sobre, une carte pleine. La carte porte la couleur du niveau
   à pleine force — ardoise, bleu, or, noir — parce que l'escalade doit se
   voir avant de se lire ; tout le reste de l'écran reste clair pour qu'il
   n'y ait qu'une seule surface forte. Aucune animation de position : un
   contenu qui glisse à chaque clic fait jouet, une transparence ne se
   remarque pas et c'est exactement ce qu'on veut. */
.tr{display:flex;gap:0;margin-top:16px}
.tr-i{flex:1 1 0;min-width:0;background:none;border:0;padding:0 0 2px;cursor:pointer;
    font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;
    position:relative;-webkit-tap-highlight-color:transparent}
.tr-i::before{content:"";position:absolute;top:20px;left:-50%;width:100%;height:2px;
    background:var(--line);z-index:0}
.tr-i:first-child::before{display:none}
.tr-i.fill::before{background:var(--accent)}
/* Le numéro du palier EST le nombre de ventes qu'il demande : 0, 10, 30, 60.
   Floqué comme au dos d'un maillot, c'est la seule chose à retenir — et
   c'est vrai, contrairement à une icône décorative. */
.tr-d{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
    font-size:14.5px;font-weight:800;letter-spacing:-.035em;line-height:1;
    background:var(--bg);color:var(--faint);font-variant-numeric:tabular-nums;
    box-shadow:inset 0 0 0 2px var(--line-2);position:relative;z-index:1;
    transition:box-shadow .2s ease,background .2s ease,color .2s ease,transform .2s ease}
.tr-i.got .tr-d{color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.tr-i.on .tr-d{background:var(--accent);color:#fff;
    box-shadow:inset 0 0 0 2px var(--accent);transform:scale(1.07)}
.tr-l{font-size:10.5px;font-weight:700;color:var(--faint);text-align:center;
    line-height:1.2;letter-spacing:-.01em}
.tr-i.on .tr-l{color:var(--ink);font-weight:800}
.tr-n{font-size:9.5px;font-weight:700;color:var(--faint);
    font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tr-i.here .tr-n{color:var(--accent)}

/* La carte du palier : la seule surface pleine de l'écran. */
.tc{border-radius:22px;padding:26px 26px 28px;margin-top:18px;color:#fff;
    animation:tcIn .22s ease-out both}
@keyframes tcIn{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.tc{animation:none}}
.tc.t0{background:#5B6478}
.tc.t1{background:var(--accent)}
.tc.t2{background:#9A7A12}
.tc.t3{background:var(--sidebar)}
.tc-k{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;font-weight:800;
    color:rgba(255,255,255,.62)}
.tc-h{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-top:9px}
.tc-n{font-size:29px;font-weight:800;letter-spacing:-.04em;line-height:1}
.tc-c{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.72);margin-top:8px}
/* Les deux gains, côte à côte. L'argent tient la colonne de gauche : c'est
   la première chose qu'on cherche, et elle manquait complètement. */
.tc-gains{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:20px;
    background:rgba(255,255,255,.2);border-radius:14px;overflow:hidden}
.tc-gain{padding:16px 16px 17px;background:rgba(255,255,255,.07)}
.tc-gk{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;
    color:rgba(255,255,255,.6)}
.tc-gv{font-size:27px;font-weight:800;letter-spacing:-.045em;line-height:1;margin-top:9px}
.tc-gd{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.72);
    margin-top:7px;line-height:1.45}
.tc-gd b{color:#fff;font-weight:800}
.tc-shirts{display:flex;gap:4px;flex-wrap:wrap;color:rgba(255,255,255,.92);margin-top:11px}
.tc-shirts svg{width:19px;height:19px;flex:none}
.tc-gain:last-child .tc-gv{margin-top:9px}
@media (max-width:400px){
    .tc-gains{grid-template-columns:1fr}
    .tc-gv{font-size:24px}
}
/* Chaque carte ne montre que ce qui S'AJOUTE. Un « + » pour un avantage
   neuf, une flèche pour celui qui en remplace un plus faible : il ne
   s'additionne pas à l'ancien, il prend sa place. Sans cette distinction, la
   carte Ambassadeur affichait « −20 % » et « −15 % » l'un sous l'autre. */
.tc-add-w{margin-top:22px;padding-top:19px;border-top:1px solid rgba(255,255,255,.2)}
.tc-add-k{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;
    color:rgba(255,255,255,.6)}
.tc-add{list-style:none;margin:4px 0 0;padding:0}
.tc-add li{display:grid;grid-template-columns:15px 1fr;gap:11px;padding:12px 0;
    font-size:13px;font-weight:600;line-height:1.45;
    border-top:1px solid rgba(255,255,255,.12)}
.tc-add li:first-child{border-top:0}
.tc-add li b{font-weight:800}
.tc-marq{color:rgba(255,255,255,.75);font-size:14px;font-weight:800;
    line-height:1.35;text-align:center}
/* L'acquis : présent, mais replié — il n'a pas à être relu à chaque palier. */
.tc-her{margin-top:18px}
.tc-herb{width:100%;display:flex;align-items:center;gap:11px;padding:13px 15px;
    border-radius:14px;background:rgba(255,255,255,.14);border:0;cursor:pointer;
    font-family:inherit;color:#fff;font-size:12.5px;font-weight:700;text-align:left}
.tc-hern{flex:0 0 auto;display:inline-grid;place-items:center;min-width:22px;height:22px;
    padding:0 6px;border-radius:100px;background:rgba(255,255,255,.92);color:var(--ink);
    font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.tc-chev{flex:0 0 auto;transition:transform .26s ease}
.tc-herc{display:none}
.tc-her.on .tc-herc{display:block}
.tc-her.on .tc-chev{transform:rotate(180deg)}
.tc-herc li{color:rgba(255,255,255,.78);font-size:12.5px}
/* Le numéro du palier repris en filigrane, comme un dossard. */
.tc{position:relative;overflow:hidden}
.tc > *{position:relative;z-index:1}
.tc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tc-puce{flex:0 0 auto;font-size:9.5px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;padding:4px 10px;border-radius:100px;
    border:1px solid rgba(255,255,255,.5);color:rgba(255,255,255,.92)}
.tc-doss{position:absolute;right:-16px;bottom:-46px;z-index:0;pointer-events:none;
    font-size:158px;font-weight:800;letter-spacing:-.07em;line-height:1;
    color:#fff;opacity:.11;font-variant-numeric:tabular-nums}
/* Ce qui manque : dit une fois, en gros. */
.tc-need{display:flex;align-items:baseline;gap:10px;margin-top:22px;padding:15px 17px;
    border-radius:14px;background:rgba(255,255,255,.14);font-size:13px;font-weight:600;
    line-height:1.4}
.tc-need b{font-size:22px;font-weight:800;letter-spacing:-.04em}
@media (max-width:420px){
    .tc{padding:22px 20px 24px}
    .tc-n{font-size:25px}
    .tc-gn{font-size:26px}
    .tr-d{width:36px;height:36px;font-size:13.5px}
    .tr-i::before{top:18px}
    .tc-doss{font-size:132px;bottom:-38px}
}

/* ── La paie : une échelle qui se remet à zéro à chaque période ───────── */
.paie{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.ps{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:15px 15px 16px;text-align:center}
.ps.done{background:var(--ok-soft);border-color:transparent}
.ps-n{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:-.01em}
.ps.done .ps-n{color:var(--ok)}
.ps-v{font-size:24px;font-weight:800;letter-spacing:-.045em;line-height:1;margin-top:8px}
.ps.done .ps-v{color:var(--ok)}
.ps-w{font-size:11px;font-weight:600;color:var(--faint);margin-top:7px;line-height:1.35}
.ps.done .ps-w{color:var(--ok)}
.ps-j{font-size:11px;font-weight:800;color:var(--accent);margin-top:6px}
.ps.done .ps-j{color:var(--ok)}
.ps-y{font-size:10.5px;font-weight:700;color:var(--faint);margin-top:8px;
    padding-top:8px;border-top:1px solid var(--line)}
.ps.done .ps-y{border-color:rgba(31,138,91,.22);color:var(--ok)}
.pay-note{background:var(--accent-soft);border-radius:16px;padding:17px 19px;margin-top:12px}
.pay-note-t{font-size:9px;letter-spacing:.17em;text-transform:uppercase;
    font-weight:700;color:var(--accent)}
.pay-note-d{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.6;font-weight:500}
.pay-note-d b{color:var(--ink);font-weight:700}
.pay-when{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:11px;
    padding-top:11px;border-top:1px solid rgba(47,80,241,.16);line-height:1.55}
.pay-when b{color:var(--accent);font-weight:800}
.sec-sub{font-size:13px;color:var(--muted);font-weight:500;margin-top:6px}
@media (max-width:520px){
    /* Une ligne par palier de paie : le seuil, où j'en suis, le montant — et
       la projection annuelle dessous, parce que c'est elle qui fait rêver. */
    .paie{grid-template-columns:1fr;gap:7px}
    .ps{display:grid;grid-template-columns:auto 1fr auto;align-items:center;
        column-gap:14px;text-align:left;padding:14px 16px;
        grid-template-areas:"n w v" "y y y"}
    .ps-n{grid-area:n}
    .ps-w{grid-area:w;margin-top:0}
    .ps{grid-template-areas:"n w v" "j j j" "y y y"}
    .ps-v{grid-area:v;margin-top:0;font-size:20px}
    .ps-j{grid-area:j;margin-top:9px}
    .ps-y{grid-area:y;margin-top:10px;padding-top:9px}
}
/* — Missions présentées comme des gains — */
.task{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;
    border:none;border-radius:14px;background:var(--surface);cursor:pointer;margin-bottom:7px;
    transition:opacity .16s ease,transform .16s ease}
.task:last-of-type{margin-bottom:0}
.task:hover{opacity:.62}
.task:active{transform:scale(.994)}
.task-e{width:36px;height:36px;border-radius:11px;background:var(--surface-2);
    display:grid;place-items:center;font-size:16px;flex-shrink:0}
.task-e.ok{background:var(--ok-soft)}
.task-b{flex:1;min-width:0}
.task-t{font-size:15px;font-weight:600;letter-spacing:-.02em}
.task-w{font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.task-go{color:var(--faint);flex-shrink:0;display:grid;place-items:center}
.task-go svg{width:15px;height:15px;stroke-width:2.2}
.task.is-done .task-t{color:var(--faint)}
/* — Code promo — */
.promo{display:flex;align-items:center;gap:14px;background:var(--surface);
    border-radius:18px;padding:22px 24px}
.promo-c{flex:1;min-width:0;font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:24px;font-weight:700;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis}
.copy-btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;
    border:none;border-radius:100px;padding:10px 18px;font-size:13.5px;font-weight:600;
    flex-shrink:0;cursor:pointer;transition:background .2s ease,transform .16s ease}
.copy-btn:hover{transform:translateY(-1px)}
.copy-btn:active{transform:scale(.97)}
.copy-btn.done{background:var(--ok)}
.copy-btn svg{width:14px;height:14px;stroke-width:2.4}
.promo-meta{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;
    color:var(--muted);font-weight:500;flex-wrap:wrap}
.promo-meta b{color:var(--ink);font-weight:700}
.promo-meta .d{width:3px;height:3px;border-radius:50%;background:var(--line-2)}
/* — Classement — La règle « un seul aplat fort par écran » tient : l'aplat de
     l'accueil reste le bloc de gains. Ici, une seule ligne est colorée, la
     sienne. C'est ce qui rend le tableau lisible d'un coup d'œil : on ne
     cherche pas son nom, on voit sa ligne. */
/* ══ CLASSEMENT ═══════════════════════════════════════════════════════════
   Une table de résultats, pas une liste. Trois choses la sortent du tableau
   administratif : une pastille d'initiale qui donne un visage à chaque ligne,
   une barre de fond proportionnelle au leader qui rend l'écart lisible sans
   qu'on ait à comparer des chiffres, et une hiérarchie typographique qui met
   le nombre de ventes au même niveau qu'un montant.

   La barre reste à très basse opacité : l'aplat fort de l'écran est le bloc
   de gains, et rien ici ne doit venir le concurrencer. */
.lb{background:var(--surface);border-radius:20px;overflow:hidden;margin-top:14px;
    border:1px solid var(--line)}
.lb-r{display:flex;align-items:center;gap:13px;padding:13px 18px;
    border-top:1px solid var(--line)}
.lb-r:first-child{border-top:0}
/* La mesure, sous le nom. Deux essais avant celui-ci : un aplat sur toute la
   hauteur se lisait comme un surlignage, et un filet collé au bas de la ligne
   se confondait avec le séparateur — dans les deux cas, ça ressemblait à un
   défaut d'affichage. Rattachée au nom, dans sa propre piste, la barre ne peut
   plus se lire que pour ce qu'elle est : une longueur qu'on compare. */
.lb-mid{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.lb-nrow{display:flex;align-items:center;gap:8px;min-width:0}
.lb-track{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
/* Une seule couleur pour toutes les barres : c'est la longueur qui distingue,
   pas la teinte. Le doré du premier reste sur son rang et sa pastille — deux
   couleurs de mesure dans le même tableau feraient croire à deux échelles. */
.lb-bar{display:block;height:100%;width:0;border-radius:3px;background:var(--accent);
    opacity:.42;transition:width .55s cubic-bezier(.22,1,.36,1)}
.lb-r.p1 .lb-bar{opacity:.7}
.lb-r.me .lb-bar{opacity:1}

.lb-pos{width:20px;flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--faint);
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:right}
/* Le premier se distingue par la couleur de son rang et l'anneau de sa
   pastille — pas par une médaille, qui ferait jeu-concours. */
.lb-r.p1 .lb-pos{color:var(--gold)}

.lb-av{width:34px;height:34px;flex-shrink:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);border:1px solid var(--line);
    font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:-.01em}
.lb-r.p1 .lb-av{border-color:var(--gold);color:var(--gold)}
.lb-r.me .lb-av{background:var(--accent);border-color:var(--accent);color:#fff}
.lb-r.out .lb-av{color:var(--faint)}

.lb-name{flex:0 1 auto;min-width:0;font-size:14.5px;font-weight:650;letter-spacing:-.02em;
    color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-r.out .lb-name{color:var(--ink-2);font-weight:600}
/* Ligne masquée : mêmes graisses que les autres, seule la fin du pseudo est
   brouillée. Le flou garde la longueur du mot — c'est ce qui fait qu'on lit
   encore un pseudo et pas une troncature. */
.lb-r.anon .lb-name{letter-spacing:-.01em}
.lb-blur{filter:blur(3.4px);opacity:.62;user-select:none;pointer-events:none;
    padding-right:3px;letter-spacing:.01em}
.lb-r.p1 .lb-blur{opacity:.7}
@supports not (filter: blur(1px)){
    /* Sans filtre CSS, le leurre serait lisible : on le remplace par des points. */
    .lb-blur{color:transparent;text-shadow:0 0 6px currentColor}
}
.lb-n{font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;
    letter-spacing:-.035em;flex-shrink:0;line-height:1}
.lb-u{font-size:11px;font-weight:600;color:var(--muted);margin-left:5px;
    letter-spacing:-.01em}
/* Ma ligne : l'accent, et lui seul. */
.lb-r.me{background:var(--accent-soft)}
.lb-r.me .lb-pos{color:var(--accent)}
.lb-r.me .lb-name,.lb-r.me .lb-n{color:var(--accent-2)}
.lb-sp{flex:1 1 auto}
/* Zéro vente : la ligne garde sa place et son chiffre, en retrait. */
.lb-r.out .lb-n{color:var(--faint);font-weight:700}
.lb-r.out .lb-pos{color:var(--faint)}
.lb-r.me.out .lb-n{color:var(--accent)}
/* Plateformes : discrètes, à hauteur de x du pseudo, jamais plus lourdes que
   lui. C'est une précision sur la personne, pas une colonne du tableau. */
.lb-plats{display:inline-flex;align-items:center;gap:5px;flex:none;opacity:.55}
.lb-plat{width:13px;height:13px;display:block;color:var(--ink-2)}
.lb-r.p1 .lb-plats{opacity:.75}
.lb-r.me .lb-plats{opacity:1}
.lb-r.me .lb-plat{color:var(--accent)}
.lb-me-tag{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;
    color:var(--accent);flex-shrink:0;padding:3px 6px;border-radius:5px;
    background:rgba(47,80,241,.1)}
/* Le trou entre la page et sa propre ligne : montrer la marche plutôt que
   faire croire au voisinage. */
.lb-gap{display:flex;justify-content:center;padding:6px 0;border-top:1px solid var(--line);
    color:var(--line-2);font-size:12px;letter-spacing:.32em;line-height:1}
/* Pagination : discrète, elle ne doit pas peser autant que le tableau. */
.lb-pager{display:flex;align-items:center;gap:5px;margin-top:12px;flex-wrap:wrap}
.lb-p{min-width:31px;height:31px;padding:0 8px;border-radius:9px;
    border:1px solid var(--line);background:var(--surface);
    font-size:12.5px;font-weight:700;color:var(--ink-2);
    font-variant-numeric:tabular-nums;transition:all .14s ease}
.lb-p:hover:not(:disabled){border-color:var(--line-2);color:var(--ink)}
.lb-p.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lb-p.nav{font-size:16px;line-height:1;color:var(--muted)}
.lb-p:disabled{opacity:.32;cursor:default}
.lb-pdots{color:var(--faint);font-weight:700;padding:0 2px}
.lb-prange{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--faint);
    font-variant-numeric:tabular-nums}
@media(max-width:420px){
    .lb-prange{flex:1 1 100%;margin-left:0;margin-top:4px}
}
/* ══ GUIDE DE PUBLICATION ═════════════════════════════════════════════════
   Une consigne opérationnelle : elle doit se lire vite et se refermer vite.
   Un rail numéroté à gauche, du texte serré, et le seul élément fort est la
   ligne à copier — c'est la seule chose qu'on vient vraiment y chercher. */
/* Les deux formats, côte à côte : ce sont deux choix, pas deux étapes. */
/* Confirmer la réception : une question, deux réponses. C'est le seul endroit
   de l'espace où elle nous apprend quelque chose que nous ignorons. */
/* Les montants sous la courbe : c'est eux qu'on vient lire, pas la pente. */
.evo{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.evo-c{flex:1 1 0;min-width:62px;text-align:center;padding:9px 6px;border-radius:11px;
    background:var(--surface-2)}
.evo-c.now{background:var(--accent-soft)}
.evo-m{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:-.01em}
.evo-c.now .evo-m{color:var(--accent)}
.evo-v{font-size:14px;font-weight:800;letter-spacing:-.03em;margin-top:2px;
    font-variant-numeric:tabular-nums}
.evo-c.now .evo-v{color:var(--accent)}
.evo-tot{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:12px}
.evo-tot b{color:var(--ink);font-weight:800}
.v-act{display:flex;gap:7px;flex:none}
.lien{color:var(--accent);font-weight:700;text-decoration:none}
.lien:hover{text-decoration:underline}
/* Un <button> porte sa propre police, son fond et ses marges : sans ça, le
   raccourci vers « Mes contenus » ressort en gris au milieu de la phrase. */
button.lien{font-family:inherit;font-size:inherit;line-height:inherit;
    background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
button.lien:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.v-del:hover{color:var(--danger);border-color:var(--danger)}
.ca{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;
    padding-top:16px;border-top:1px solid var(--line)}
.ca-q{font-size:14px;font-weight:700;letter-spacing:-.02em;flex:1 1 auto}
.ca-b{display:flex;gap:8px;flex-wrap:wrap}
.ca-ok{display:flex;align-items:center;gap:8px;margin-top:16px;padding:12px 14px;
    background:var(--ok-soft);border-radius:12px;
    font-size:13px;font-weight:600;color:var(--ok)}
.ca-ok.warn{background:var(--warn-soft);color:#96590A}
.ca-ok svg{width:15px;height:15px;flex:none}
/* Les deux colonnes n'ont pas le même nombre de lignes de texte : sans rien,
   le bloc d'exemples de gauche démarre plus bas que celui de droite et les
   vidéos se retrouvent en escalier. On colle donc les exemples au bas de
   chaque carte — les cartes ayant la même hauteur, tout se réaligne. */
.gd-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;align-items:stretch}
.gd-f{display:flex;flex-direction:column;
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:18px 20px 20px}
.gd-fk{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:var(--accent)}
.gd-ft{font-size:16px;font-weight:800;letter-spacing:-.025em;color:var(--ink);margin-top:7px}
.gd-fd{font-size:13px;font-weight:500;color:var(--muted);line-height:1.55;margin-top:5px}
.gd-fl{list-style:none;margin:13px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;flex:none}
.gd-fl li{position:relative;padding-left:16px;font-size:13px;font-weight:500;
    color:var(--ink);line-height:1.5}
.gd-fl li::before{content:"";position:absolute;left:1px;top:8px;width:5px;height:5px;
    border-radius:50%;background:var(--accent);opacity:.55}
/* Le tronc commun : le seul endroit où il y a quelque chose à copier. */
/* Les exemples. Une consigne écrite se discute, une vidéo se copie — et
   la deuxième lève le vrai blocage : beaucoup n'osent pas parler à la
   caméra et abandonnent plutôt que de demander si c'est permis. Format
   9:16 : c'est celui dans lequel elles filment, autant le montrer tel quel. */
.gd-ex{margin-top:auto;padding-top:15px;border-top:1px solid var(--line)}
/* La marge minimale reste, `auto` ne devant coller le trait au texte que
   lorsqu'il n'y a plus de place à distribuer. */
.gd-fl + .gd-ex{margin-top:16px}
@supports(display:grid){ .gd-fl + .gd-ex{margin-top:auto} }
.gd-exk{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);margin-bottom:10px}
.gd-exg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gd-exi{margin:0;min-width:0}
.gd-exv{position:relative;aspect-ratio:9/16;border-radius:14px;overflow:hidden;
    background:#0B1020;border:1px solid var(--line)}
.gd-exv video{width:100%;height:100%;object-fit:cover;display:block;background:#0B1020}
.gd-exc{display:flex;align-items:baseline;gap:6px;margin-top:8px;
    font-size:12px;font-weight:600;color:var(--ink);line-height:1.35}
.gd-exn{flex:none;font-size:10px;font-weight:800;color:var(--faint);
    font-variant-numeric:tabular-nums}
@media(max-width:420px){
    .gd-exg{gap:8px}
    .gd-exc{font-size:11.5px}
}
.gd-common{background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:2px 20px 6px;margin-top:12px}
.gd-ck{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);padding:17px 0 1px}
.gd-s{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.gd-s:first-child,.gd-ck + .gd-s{border-top:0}
.gd-n{flex:none;width:23px;height:23px;border-radius:50%;margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);
    font-size:11.5px;font-weight:800;letter-spacing:-.02em}
.gd-b{min-width:0;flex:1}
.gd-t{font-size:14.5px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.gd-d{font-size:13px;font-weight:500;color:var(--muted);line-height:1.55;margin-top:3px}
.gd-copy{display:flex;align-items:center;gap:12px;margin-top:11px;padding:11px 13px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.gd-txt{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink);
    line-height:1.45;word-break:break-word}
.gd-foot{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:12px}
@media(max-width:860px){
    .gd-two{grid-template-columns:1fr;gap:10px}
    .gd-f{padding:16px 16px 18px}
    .gd-ft{font-size:15.5px}
    .gd-common{padding:0 15px 4px}
    .gd-s{gap:11px;padding:14px 0}
    .gd-copy{flex-direction:column;align-items:stretch;gap:9px}
}
.lb-foot{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:12px;line-height:1.55}
@media(max-width:860px){
    .lb-r{padding:12px 14px;gap:10px}
    .lb-av{width:31px;height:31px;font-size:12px}
    .lb-name{font-size:14px}
    .lb-n{font-size:16px}
}
/* — Évolution : vide tant qu'il n'y a pas deux mois d'historique — */
.chart-empty{border:1px dashed var(--line-2);border-radius:18px;padding:34px 24px;text-align:center}
.chart-empty-t{font-size:14.5px;font-weight:600}
.chart-empty-d{font-size:13px;color:var(--muted);font-weight:500;margin-top:5px;
    max-width:280px;margin-left:auto;margin-right:auto;line-height:1.55}
.spark{display:block;width:100%;height:76px;margin-top:6px}
.spark-x{display:flex;justify-content:space-between;font-size:12px;
    color:var(--faint);font-weight:600;margin-top:4px}
/* — Ligne simple — */
.line{display:flex;align-items:center;gap:14px;padding:16px 0;width:100%;text-align:left;
    background:none;border:none;cursor:pointer}
.line-b{flex:1;min-width:0}
.line-t{font-size:15px;font-weight:600;letter-spacing:-.02em}
.line-d{font-size:13px;color:var(--muted);font-weight:500;margin-top:1px}
.line-v{font-size:13px;color:var(--faint);font-weight:600;flex-shrink:0}
/* — Classes partagées avec les autres vues — */
.num{font-variant-numeric:tabular-nums}
.line-status{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    font-size:13px;color:var(--muted);font-weight:500}
.line-status b{color:var(--ink);font-weight:700}
.sep{width:3px;height:3px;border-radius:50%;background:var(--line-2);flex-shrink:0}
.kpi-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
/* — Apparition — */
.rise{opacity:0;transform:translateY(10px);animation:rise .5s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media(max-width:860px){
    .gains{padding:24px 22px 22px;border-radius:22px}
    .gains-v{font-size:46px}
    .goal-left{font-size:24px}
    /* Le décompte et le lien ne tiennent pas sur une ligne : on les empile. */
    .goal-foot{flex-direction:column;align-items:flex-start;gap:13px}
    .sec + .sec{margin-top:34px}
    .promo-c{font-size:21px}
}
/* ── Timeline paliers ───────────────────────────────────────────────────── */
.ladder{display:flex;flex-direction:column;gap:0}
.rung{display:flex;gap:14px;position:relative;padding-bottom:20px}
.rung:last-child{padding-bottom:0}
.rung::before{
    content:'';position:absolute;left:15px;top:34px;bottom:0;width:2px;background:var(--line-2);
}
.rung:last-child::before{display:none}
.rung.reached::before{background:var(--accent)}
.rung-badge{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    font-size:15px;background:var(--surface-2);border:2px solid var(--line-2);position:relative;z-index:1;
}
.rung.reached .rung-badge{background:var(--accent-soft);border-color:var(--accent)}
.rung.current .rung-badge{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.rung-body{padding-top:3px;min-width:0;flex:1}
.rung-name{font-size:13.5px;font-weight:800;letter-spacing:-.015em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rung-tag{
    font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;
    background:var(--accent);color:#fff;
}
.rung-perks{margin-top:7px;display:flex;flex-direction:column;gap:4px}
.rung-perk{font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;gap:7px;align-items:flex-start;line-height:1.45}
.rung-perk svg{flex-shrink:0;margin-top:2px}
.rung:not(.reached) .rung-perk{color:var(--faint)}
/* ── Missions ───────────────────────────────────────────────────────────── */
/* Une mission est une ligne, séparée par un filet — pas une carte. */
.mission{
    display:flex;align-items:center;gap:14px;padding:17px 18px;border-radius:14px;
    border:none;background:var(--surface);margin-bottom:7px;
    transition:opacity .15s;
}
.mission:last-child{margin-bottom:0}
.mission:hover{opacity:.65}
/* Cliquable, donc : curseur, chevron, largeur pleine, alignement à gauche —
   un <button> hérite sinon du centrage et de la police du navigateur. */
.mission.go{width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer}
.mission-fl{width:15px;height:15px;flex-shrink:0;color:var(--faint);
    transition:transform .16s ease,color .16s ease}
.mission.go:hover .mission-fl{transform:translateX(2px);color:var(--muted)}
.mission.go:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mission.done{background:none}
.mission-check{
    width:18px;height:18px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    border:1.5px solid var(--line-2);background:var(--surface);
}
.mission.done .mission-check{background:var(--ok);border-color:var(--ok)}
.mission-body{flex:1;min-width:0}
.mission-label{font-size:14.5px;font-weight:600;letter-spacing:-.015em}
.mission.done .mission-label{color:var(--faint);text-decoration:line-through}
.mission-desc{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.mission-state{font-size:12px;font-weight:500;padding:0;border-radius:0;flex-shrink:0;background:none}
.st-done{background:none;color:var(--ok)}
.st-todo{background:none;color:var(--faint);border:none}
/* ── Colis / timeline ───────────────────────────────────────────────────── */
.ship{display:flex;flex-direction:column;gap:0;margin-top:2px}
.ship-step{display:flex;gap:12px;position:relative;padding-bottom:14px}
.ship-step:last-child{padding-bottom:0}
.ship-step::before{content:'';position:absolute;left:5px;top:16px;bottom:0;width:1px;background:var(--line)}
.ship-step:last-child::before{display:none}
.ship-step.done::before{background:var(--ok)}
/* Repère de 11px, pas une pastille : l'étape se lit dans le texte. */
.ship-dot{
    width:11px;height:11px;margin-top:5px;border-radius:50%;flex-shrink:0;
    border:1.5px solid var(--line-2);background:var(--surface);
    display:grid;place-items:center;position:relative;z-index:1;overflow:hidden;
}
.ship-dot svg{display:none}
.ship-step.done .ship-dot{background:var(--ok);border-color:var(--ok)}
.ship-step.current .ship-dot{border-color:var(--accent);background:var(--accent);box-shadow:none}
.ship-label{font-size:13.5px;font-weight:500;padding-top:0}
.ship-step:not(.done):not(.current) .ship-label{color:var(--faint)}
.ship-date{font-size:11.5px;color:var(--muted);font-weight:500}
.track-box{
    background:none;border:none;border-radius:0;
    padding:0;margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.track-num{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:.02em;flex:1;min-width:120px;word-break:break-all}
/* ── Boutons ────────────────────────────────────────────────────────────── */
.btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 19px;border-radius:11px;font-size:13.5px;font-weight:700;
    background:var(--accent-grad);color:#fff;box-shadow:var(--sh-accent);
    transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s;letter-spacing:-.01em;
}
.btn:hover{opacity:.9}
.btn:active{opacity:1}
/* Action secondaire : un lien, pas un bouton dessiné. */
.btn-ghost{
    background:none;color:var(--muted);border:none;box-shadow:none;padding:0;
    font-size:13px;border-radius:0;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:color .15s;
}
.btn-ghost:hover{color:var(--accent)}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:9px}
/* ── Empty state ────────────────────────────────────────────────────────── */
.empty{text-align:center;padding:30px 18px}
.empty-ico{
    width:auto;height:auto;background:none;color:var(--faint);
    display:grid;place-items:center;margin:0 auto 10px;
}
.empty-title{font-size:14px;font-weight:700;letter-spacing:-.015em}
.empty-text{font-size:12.5px;color:var(--muted);font-weight:500;margin:5px auto 15px;max-width:280px;line-height:1.55}
/* ── Divers ─────────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:0;border-radius:0;background:none!important}
.b-ok{color:var(--ok)}
.b-warn{color:var(--warn)}
.b-info{color:var(--accent)}
.b-muted{color:var(--faint)}
.skeleton{background:linear-gradient(90deg,#EAE9E2 25%,#F5F4F0 50%,#EAE9E2 75%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Les réglages de publication TikTok ─────────────────────────────────
   Deux captures par geste, recadrées sur la zone entourée. Empilées en
   pleine hauteur, les six écrans d'origine faisaient quatre écrans de
   défilement : personne n'arrive au bout, donc personne n'active
   l'autorisation publicitaire — et le budget ne peut pas suivre. */
.tk{margin-top:11px}
.tk-s{padding:12px 0;border-top:1px dashed var(--line)}
.tk-s:first-child{border-top:0;padding-top:3px}
.tk-x{display:grid;grid-template-columns:19px 1fr;gap:9px;
    font-size:13px;font-weight:500;color:var(--ink-2);line-height:1.5}
.tk-x b{font-weight:800;color:var(--ink)}
.tk-n{font-size:10.5px;font-weight:800;color:var(--faint);padding-top:2px}
.tk-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0 0 28px}
.tk-g.solo{grid-template-columns:1fr}
.tk-img{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;
    background:var(--surface-2);cursor:zoom-in;display:block;width:100%;
    transition:border-color .16s,transform .16s}
.tk-img:hover{border-color:var(--accent);transform:translateY(-1px)}
.tk-img:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tk-img img{width:100%;display:block}
.tk-pq{margin-top:14px;padding:14px 15px;border-radius:15px;
    background:var(--accent);color:#fff}
.tk-pq-t{font-size:15px;font-weight:800;letter-spacing:-.025em;line-height:1.3}
.tk-pq-d{font-size:12.5px;font-weight:500;color:var(--on-accent);
    margin-top:7px;line-height:1.55}
.tk-res{margin-top:13px;padding:14px 15px;border-radius:15px;
    background:var(--ok-soft);border:1px solid #C6E4D5}
.tk-res-d{font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.5}
.tk-res img{width:100%;border-radius:10px;margin-top:10px;display:block;
    border:1px solid #C6E4D5}
@media(max-width:400px){
    .tk-g{margin-left:0;gap:6px}
    .tk-x{grid-template-columns:16px 1fr;gap:7px}
}
/* La loupe : la vignette dit où appuyer, l'agrandissement lève le doute. */
.tk-loupe{position:fixed;inset:0;background:rgba(8,10,20,.9);z-index:120;
    display:none;place-items:center;padding:20px;cursor:zoom-out}
.tk-loupe.on{display:grid}
.tk-loupe img{max-width:min(560px,94vw);max-height:88vh;border-radius:12px;display:block}


.toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
    background:var(--sidebar);color:#fff;padding:12px 20px;border-radius:100px;
    font-size:13px;font-weight:700;box-shadow:var(--sh-lg);z-index:99;
    transition:transform .32s cubic-bezier(.2,.8,.2,1);
}
/* L'action centrale du programme : coller le lien de sa vidéo. Elle portait la
   classe d'un bouton fantôme — ni bordure, ni fond, texte en gris clair. Rien
   n'indiquait qu'on pouvait taper dedans. */
.inp-v{font-family:inherit;font-size:16px;font-weight:500;color:var(--ink);
    padding:11px 13px;border:1px solid var(--line-2);border-radius:12px;
    background:var(--surface);transition:border-color .15s,box-shadow .15s}
.inp-v:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(47,80,241,.11)}
.inp-v::placeholder{color:var(--faint);font-weight:500}

.sq-wrap{display:flex;flex-direction:column;gap:12px}
.sq{border-radius:18px;background:linear-gradient(100deg,
    var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%);
    background-size:220% 100%;animation:sqGlisse 1.3s ease-in-out infinite}
.sq-a{height:132px}
.sq-b{height:88px}
@keyframes sqGlisse{from{background-position:180% 0}to{background-position:-40% 0}}
@media(prefers-reduced-motion:reduce){.sq{animation:none}}

.toast.show{transform:translateX(-50%) translateY(0)}
/* Une erreur est rouge : dans la même pastille bleue que « Vidéo ajoutée »,
   « Copie impossible ici » se lisait comme une confirmation. */
.toast.err{background:var(--danger)}
@media(max-width:860px){
    /* Sinon le message se pose sur les icônes de la barre du bas. */
    .toast{bottom:84px}
}
.mob-nav{display:none}
/* ── Formulaire profil ──────────────────────────────────────────────────── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
/* 16 px, pas moins : en dessous, Safari et les navigateurs intégrés
   d'Instagram et TikTok agrandissent la page à la mise au point, et
   elle reste agrandie — tout le reste de l'espace défile alors
   latéralement. C'est la taille minimale, pas un choix graphique. */
.field input,.field select{
    background:var(--surface-2);border:1px solid var(--line-2);border-radius:11px;
    padding:11px 13px;font-size:16px;font-weight:500;color:var(--ink);width:100%;
    transition:border-color .15s,background .15s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);background:#fff;
    box-shadow:0 0 0 3px rgba(47,80,241,.08)}
.field input::placeholder{color:var(--faint)}
.field-hint{font-size:11px;color:var(--faint);font-weight:500}
/* Le groupe par réseau n'a pas besoin d'un cadre : un filet suffit.
   Les champs, eux, gardent leur bordure — elle est fonctionnelle. */
.plat-block{border:none;border-radius:0;padding:20px 0;background:none;margin-bottom:0;border-bottom:1px solid var(--line)}
.plat-block:last-of-type{border-bottom:none}
.plat-head{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.plat-ico{width:20px;height:20px;border-radius:0;background:none!important;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.plat-name{font-size:14px;font-weight:600}
.plat-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
@media(max-width:640px){.plat-fields{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
/* ── Sélecteur de maillots ──────────────────────────────────────────────── */
.pick-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pick-count{font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:100px;background:var(--accent-soft);color:var(--accent)}
.pick-count.full{background:var(--ok-soft);color:var(--ok)}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
.jcard{border:2px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);
       cursor:pointer;transition:all .16s;position:relative}
.jcard:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--sh-md)}
.jcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,80,241,.1),var(--sh-md)}
.jcard-img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;display:block}
.jcard-body{padding:10px 11px;border-top:1px solid var(--line)}
.jcard-name{font-size:12.5px;font-weight:800;letter-spacing:-.015em;line-height:1.3}
.jcard-sub{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}
.jcard-tick{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;
            background:var(--accent);display:none;place-items:center;box-shadow:var(--sh-md)}
.jcard.sel .jcard-tick{display:grid}
.jsizes{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.jsize{flex:1;min-width:30px;text-align:center;padding:5px 2px;border-radius:7px;border:1px solid var(--line-2);
       font-size:11.5px;font-weight:800;background:var(--surface-2);color:var(--ink-2);transition:all .13s}
.jsize:hover{border-color:var(--accent)}
.jsize.on{background:var(--accent);border-color:var(--accent);color:#fff}
.jsize.out{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.picked{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:14px}
.picked-item{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid var(--accent-soft);
             border-radius:var(--r);padding:8px 13px 8px 8px}
.picked-img{width:38px;height:38px;border-radius:8px;object-fit:contain;background:#fff;flex-shrink:0}
.picked-name{font-size:12.5px;font-weight:800;line-height:1.25}
.picked-size{font-size:11px;color:var(--accent);font-weight:700}
.picked-rm{color:var(--muted);font-size:15px;cursor:pointer;padding:0 3px}
.picked-rm:hover{color:var(--danger)}
.sticky-save{position:sticky;bottom:14px;margin-top:18px;display:flex;justify-content:center;z-index:20}
.sticky-save .btn{box-shadow:var(--sh-lg)}
@media(max-width:860px){.sticky-save{bottom:78px}}
/* ── Responsive (mobile-first pour l'espace influenceur) ────────────────── */
@media(max-width:1060px){
    .g-main{grid-template-columns:1fr}
}
@media(max-width:860px){
    .side{display:none}
    .main{padding:18px 16px 90px}
    .hello h1{font-size:22px}
    .g-2{grid-template-columns:1fr}
    /* Six onglets : la barre est plus dense, mais Contenus doit y figurer —
       c'est sur téléphone que les vidéos se déclarent. Le filet remplace
       l'ombre portée : il sépare aussi nettement, sans halo. */
    .mob-nav{
        display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--sidebar);
        padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:50;
        border-top:1px solid rgba(255,255,255,.07);
    }
    .mob-item{
        flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
        padding:6px 1px;color:var(--on-dark-dim);font-size:9.5px;font-weight:700;
        border-radius:9px;letter-spacing:-.01em;
    }
    .mob-item svg{width:18px;height:18px}
    .mob-item.active{color:#fff;background:rgba(255,255,255,.09)}
    .mob-head{
        display:flex;align-items:center;gap:11px;margin-bottom:18px;
        padding:13px 15px;background:var(--sidebar);border-radius:var(--r-lg);color:#fff;
    }
}
@media(min-width:861px){ .mob-head{display:none} }
@media(max-width:420px){
    .g-kpi{grid-template-columns:1fr 1fr;gap:11px}
    .card{padding:17px}
}
/* ══════════════════════════════════════════════════════════════════════════
   MOBILE — même page, échelle réduite. Aucun composant spécifique : la
   densité vient de l'absence de cadres, pas d'un traitement séparé.
   ══════════════════════════════════════════════════════════════════════════ */
@media(max-width:860px){
    .main{padding:16px 20px 96px}
    /* En-tête : une ligne d'identité sobre, sans surface sombre. */
    .mob-head{
        display:flex;align-items:center;gap:11px;background:none;color:var(--ink);
        padding:0;margin-bottom:26px;border-radius:0;
    }
    .mob-head .brand-mark{width:30px;height:30px;font-size:13px;border-radius:9px}
    #mobName{font-size:14.5px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
    #mobTier{font-size:12px;font-weight:500;color:var(--muted);line-height:1.3}
    /* Le prénom est déjà juste au-dessus. */
    .topline{display:none}
    .sec + .sec{margin-top:38px}
    .rule{margin:22px 0}
    .amount{font-size:42px;margin-top:11px}
    .amount-note{font-size:13.5px;margin-top:8px}
    .line-status{font-size:12.5px}
    .unlock-need,.unlock-reward{font-size:13.5px}
    .unlock-line{gap:12px}
    .act{padding:15px 0;gap:12px}
    .act-label{font-size:15px}
    .act-desc{font-size:13px}
    /* Trois chiffres restent lisibles côte à côte jusqu'à 360px. */
    .stats-row{gap:16px}
    .stat-k{font-size:11.5px}
    .stat-v{font-size:19px;margin-top:5px}
    /* Le filet vertical ne tient pas en une colonne : il devient horizontal. */
    .minor{grid-template-columns:1fr;gap:30px}
    .minor > div + div{
        padding-left:0;border-left:none;margin-left:0;
        padding-top:30px;border-top:1px solid var(--line);
    }
    .promo-code-l{font-size:26px}
    .card + .card{margin-top:32px}
    .card-title{font-size:16px}
}
@media(max-width:360px){
    .main{padding:16px 16px 96px}
    .amount{font-size:37px}
    .stats-row{gap:12px}
    .stat-v{font-size:17px}
    .stat-k{font-size:11px}
}
@media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>

    <main class="main">
        <div class="wrap">

        Profil
