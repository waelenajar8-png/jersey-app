<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accès admin — Volakits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sidebar:#0E1330;
    --bg:#F7F8FC;
    --accent:#4F46E5;
    --accent-2:#7C3AED;
    --accent-grad:linear-gradient(135deg,#4F46E5 0%,#7C3AED 100%);
    --text-dim:#6B7280;
    --danger:#DC2626;
    --danger-bg:#FEF2F2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--sidebar);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    background:var(--bg);
    border-radius:20px;
    padding:40px 36px;
    width:100%;
    max-width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .logo{
    width:48px;height:48px;
    border-radius:12px;
    background:var(--accent-grad);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    margin-bottom:20px;
  }
  h1{font-size:20px;font-weight:800;color:#111827;letter-spacing:-0.02em;margin-bottom:4px}
  p.sub{font-size:13.5px;color:var(--text-dim);margin-bottom:28px}
  label{display:block;font-size:11.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px}
  input[type=password]{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    border:1.5px solid #E5E7EB;
    font-size:14.5px;
    font-family:inherit;
    background:#fff;
    outline:none;
    transition:border-color .15s;
  }
  input[type=password]:focus{border-color:var(--accent)}
  button{
    width:100%;
    margin-top:18px;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--accent-grad);
    color:#fff;
    font-family:inherit;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    transition:opacity .15s;
  }
  button:hover{opacity:0.92}
  .error{
    background:var(--danger-bg);
    color:var(--danger);
    font-size:13px;
    font-weight:600;
    padding:11px 14px;
    border-radius:9px;
    margin-bottom:18px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🔒</div>
    <h1>Accès admin</h1>
    <p class="sub">Espace réservé — pilotage du programme ambassadeur Volakits.</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/influenceurs/login">
      <label>Mot de passe</label>
      <input type="password" name="password" autofocus {% if not configured %}disabled{% endif %} placeholder="{% if configured %}••••••••{% else %}Non configuré côté serveur{% endif %}">
      <button type="submit" {% if not configured %}disabled{% endif %}>Se connecter</button>
    </form>
  </div>
</body>
</html>
