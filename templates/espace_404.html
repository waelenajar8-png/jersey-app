<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace introuvable — Volakits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    background:#F7F8FC;color:#0B1020;min-height:100vh;
    display:grid;place-items:center;padding:24px;
    -webkit-font-smoothing:antialiased;letter-spacing:-.011em;
}
.box{
    background:#fff;border:1px solid #EAECF3;border-radius:26px;
    border:1px solid #EDEEF3;
    padding:44px 38px;max-width:430px;text-align:center;
}
.mark{
    width:52px;height:52px;border-radius:15px;
    background:linear-gradient(158deg,#3A5AF6 0%,#2F50F1 46%,#2846DC 100%);
    display:grid;place-items:center;margin:0 auto 22px;
    font-weight:800;font-size:22px;color:#fff;
    
}
h1{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-bottom:9px}
p{font-size:14px;color:#7C859B;font-weight:500;line-height:1.6}
.hint{
    margin-top:24px;padding:14px 16px;background:#FBFCFE;
    border:1px dashed #DFE3EE;border-radius:14px;
    font-size:12.5px;color:#3A4157;font-weight:500;line-height:1.55;
}
</style>
</head>
<body>
<div class="box">
    <div class="mark">V</div>
    <h1>Cet espace n'existe pas</h1>
    <p>Le lien que tu as utilisé n'est plus valide, ou il a été mal recopié.</p>
    <div class="hint">Vérifie que tu as bien copié le lien en entier, ou demande à l'équipe Volakits de t'en renvoyer un nouveau.</div>
</div>
</body>
</html>
